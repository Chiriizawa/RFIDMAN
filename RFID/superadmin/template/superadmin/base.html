<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .header-gradient {
            background: linear-gradient(180deg, #1e40af 0%, #3b82f6 100%);
        }

        .nav-tab {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: rgba(255, 255, 255, 0.85);
        }

        .nav-tab.active {
            background-color: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .nav-tab:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        body {
            background-color: #0f172a;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("{{ url_for('static', filename='images/geminilogo.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.55) 0%, rgba(30, 64, 175, 0.25) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .page-content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body class="bg-slate-900">

    <div class="min-h-screen flex relative z-[1]">

        <!-- SIDEBAR -->
        <aside class="header-gradient fixed left-0 top-0 h-screen w-72 text-white shadow-2xl z-50 flex flex-col">

            <!-- LOGO -->
            <div class="px-6 py-6 border-b border-white/20">
                <div class="flex items-center gap-x-3">
                    <div class="w-14 h-14 bg-white rounded-xl flex items-center justify-center overflow-hidden shadow border border-white/40">
                        <img src="{{ url_for('static', filename='images/cropted.png') }}"
                             alt="School Logo"
                             class="w-full h-full object-cover">
                    </div>

                    <div>
                        <h1 class="text-3xl font-semibold tracking-[-0.5px] leading-none">DMRMINHS</h1>
                    </div>
                </div>
            </div>

            <!-- NAVIGATION -->
            <nav class="flex-1 px-4 py-5 space-y-2 overflow-y-auto">

                <a href="{{ url_for('sadmin.index') }}"
                   class="nav-tab {% if request.endpoint == 'sadmin.index' %}active{% endif %} flex items-center gap-x-3 px-4 py-3 rounded-2xl text-sm font-semibold">
                    <i class="fa-solid fa-gauge w-5 text-center"></i>
                    <span>Dashboard</span>
                </a>

                <a href="{{ url_for('sadmin.attendance') }}"
                   class="nav-tab {% if request.endpoint == 'sadmin.attendance' %}active{% endif %} flex items-center gap-x-3 px-4 py-3 rounded-2xl text-sm font-semibold">
                    <i class="fa-solid fa-layer-group w-5 text-center"></i>
                    <span>Attendance</span>
                </a>

                <a href="{{ url_for('sadmin.uid') }}"
                   class="nav-tab {% if request.endpoint == 'sadmin.uid' %}active{% endif %} flex items-center gap-x-3 px-4 py-3 rounded-2xl text-sm font-semibold">
                    <i class="fa-solid fa-id-card w-5 text-center"></i>
                    <span>UID</span>
                </a>

                <a href="{{ url_for('section_bp.section') }}"
                   class="nav-tab {% if request.endpoint == 'section_bp.section' %}active{% endif %} flex items-center gap-x-3 px-4 py-3 rounded-2xl text-sm font-semibold">
                    <i class="fa-solid fa-table-cells-large w-5 text-center"></i>
                    <span>Section</span>
                </a>
                
                <a href="{{ url_for('schedule.schedule') }}"
                   class="nav-tab {% if request.endpoint == 'schedule.schedule' %}active{% endif %} flex items-center gap-x-3 px-4 py-3 rounded-2xl text-sm font-semibold">
                    <i class="fa-solid fa-calendar-days w-5 text-center"></i>
                    <span>Schedule</span>
                </a>

                <a href="{{ url_for('sregister.student') }}"
                   class="nav-tab {% if request.endpoint == 'sregister.student' %}active{% endif %} flex items-center gap-x-3 px-4 py-3 rounded-2xl text-sm font-semibold">
                    <i class="fa-solid fa-user-graduate w-5 text-center"></i>
                    <span>Students</span>
                </a>

                <a href="{{ url_for('teacher_bp.teachers') }}"
                   class="nav-tab {% if request.endpoint == 'teacher_bp.teachers' %}active{% endif %} flex items-center gap-x-3 px-4 py-3 rounded-2xl text-sm font-semibold">
                    <i class="fa-solid fa-chalkboard-user w-5 text-center"></i>
                    <span>Teachers</span>
                </a>

            </nav>

            <!-- PROFILE / DROPDOWN -->
            <div class="px-4 py-5 border-t border-white/20 relative">
                <button type="button"
                    onclick="toggleDropdown()"
                    class="w-full flex items-center justify-between gap-x-3 px-4 py-3 bg-white text-[#1e40af] rounded-2xl shadow-inner border border-white/30">

                    <div class="flex items-center gap-x-3">
                        <span class="w-10 h-10 flex items-center justify-center font-bold text-lg bg-[#1e40af] text-white rounded-xl">
                            HD
                        </span>

                        <div class="text-left leading-tight">
                            <p class="text-sm font-bold">Superadmin</p>
                        </div>
                    </div>

                    <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200" id="dropdownIcon"></i>
                </button>

                <div id="profileDropdown"
                    class="hidden absolute left-4 right-4 bottom-20 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden z-50">

                    <a href="{{ url_for('sadmin.backup_database') }}"
                        class="flex items-center gap-x-3 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
                        <i class="fa-solid fa-database text-[#1e40af] w-5 text-center"></i>
                        Backup Database
                    </a>

                    <a href="{{ url_for('sadmin.logout') }}"
                        class="flex items-center gap-x-3 px-4 py-3 text-sm font-medium text-red-600 hover:bg-red-50 transition border-t border-slate-100">
                        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                        Logout
                    </a>

                </div>
            </div>

        </aside>

        <!-- PAGE CONTENT -->
        <main class="page-content ml-72 w-[calc(100%-18rem)] min-h-screen">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById("profileDropdown");
            const icon = document.getElementById("dropdownIcon");

            dropdown.classList.toggle("hidden");
            icon.classList.toggle("rotate-180");
        }

        document.addEventListener("click", function(event) {
            const dropdown = document.getElementById("profileDropdown");
            const button = event.target.closest("button[onclick='toggleDropdown()']");
            const icon = document.getElementById("dropdownIcon");

            if (!button && dropdown && !dropdown.contains(event.target)) {
                dropdown.classList.add("hidden");
                icon.classList.remove("rotate-180");
            }
        });
    </script>

</body>
</html>
