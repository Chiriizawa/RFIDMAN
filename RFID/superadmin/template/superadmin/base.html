<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GoShopping Superadmin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .header-gradient {
            background: linear-gradient(90deg, #1e40af 0%, #3b82f6 100%);
        }

        .nav-tab {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-tab.active {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .nav-tab:hover:not(.active) {
            background-color: #f1f5f9;
        }
    </style>
</head>

<body class="bg-slate-50">

    <!-- HEADER -->
    <header class="header-gradient text-white">
        <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">

            <div class="flex items-center gap-x-3">
                <div class="w-14 h-14 bg-white rounded-xl flex items-center justify-center overflow-hidden shadow border border-white/40">
                    <img src="{{ url_for('static', filename='images/cropted.png') }}"
                         alt="School Logo"
                         class="w-full h-full object-cover">
                </div>
                <h1 class="text-3xl font-semibold tracking-[-0.5px]">SuperAdmin</h1>
            </div>

            <!-- Right side -->
            <div class="flex items-center gap-x-7 relative">
                
                <!-- PROFILE BUTTON -->
                <button type="button"
                    onclick="toggleDropdown()"
                    class="flex items-center gap-x-1 px-2 h-9 bg-white text-[#1e40af] rounded-2xl shadow-inner border border-white/30">
                    
                    <span class="w-8 h-8 flex items-center justify-center font-bold text-lg">
                        HD
                    </span>

                    <!-- Dropdown Icon -->
                    <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200"
                       id="dropdownIcon"></i>
                </button>

                <!-- DROPDOWN -->
                <div id="profileDropdown"
                    class="hidden absolute right-0 top-14 w-52 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden z-50">
                    
                    <a href="#"
                        class="flex items-center gap-x-3 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
                        <i class="fa-solid fa-database text-[#1e40af]"></i>
                        Backup Database
                    </a>

                    <a href="#"
                        class="flex items-center gap-x-3 px-4 py-3 text-sm font-medium text-red-600 hover:bg-red-50 transition border-t border-slate-100">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </div>

            </div>
        </div>
    </header>

    <!-- NAVIGATION -->
    <div class="bg-white border-b sticky top-0 z-40 shadow-sm">
        <div class="max-w-screen-2xl mx-auto px-8">
            <div class="flex items-center justify-center gap-x-3 pt-6 pb-3">

                <a href="{{ url_for('sadmin.index') }}"
                    class="nav-tab {% if request.endpoint == 'sadmin.index' %}active{% endif %} flex items-center justify-center gap-x-3 px-7 py-4 rounded-3xl text-base font-semibold min-w-[170px] text-slate-700">
                    <i class="fa-solid fa-gauge text-lg"></i>
                    Dashboard
                </a>

                <a href="{{ url_for('sadmin.attendance') }}"
                    class="nav-tab {% if request.endpoint == 'sadmin.attendance' %}active{% endif %} flex items-center justify-center gap-x-3 px-7 py-4 rounded-3xl text-base font-semibold min-w-[170px] text-slate-700">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                    Section
                </a>

                <a href="{{ url_for('sadmin.uid') }}"
                    class="nav-tab {% if request.endpoint == 'sadmin.uid' %}active{% endif %} flex items-center justify-center gap-x-3 px-7 py-4 rounded-3xl text-base font-semibold min-w-[170px] text-slate-700">
                    <i class="fa-solid fa-id-card text-lg"></i>
                    UID
                </a>

                <a href="{{ url_for('sregister.student') }}"
                    class="nav-tab {% if request.endpoint == 'sregister.student' %}active{% endif %} flex items-center justify-center gap-x-3 px-7 py-4 rounded-3xl text-base font-semibold min-w-[170px] text-slate-700">
                    <i class="fa-solid fa-user-graduate text-lg"></i>
                    Students
                </a>

                <a href="{{ url_for('teacher_bp.teachers') }}"
                    class="nav-tab flex items-center justify-center gap-x-3 px-7 py-4 rounded-3xl text-base font-semibold min-w-[170px] text-slate-700">
                    <i class="fa-solid fa-chalkboard-user text-lg"></i>
                    Teachers
                </a>

            </div>
        </div>
    </div>

    <!-- PAGE CONTENT -->
    {% block content %}{% endblock %}

    <!-- SCRIPT -->
    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById("profileDropdown");
            const icon = document.getElementById("dropdownIcon");

            dropdown.classList.toggle("hidden");
            icon.classList.toggle("rotate-180");
        }

        document.addEventListener("click", function(event) {
            const dropdown = document.getElementById("profileDropdown");
            const button = event.target.closest("button[onclick='toggleDropdown()']");
            const icon = document.getElementById("dropdownIcon");

            if (!button && !dropdown.contains(event.target)) {
                dropdown.classList.add("hidden");
                icon.classList.remove("rotate-180");
            }
        });
    </script>

</body>
</html>
