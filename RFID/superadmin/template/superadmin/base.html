<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .header-gradient {
            background: linear-gradient(90deg, #1e40af 0%, #3b82f6 100%);
        }

        .nav-tab {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: rgba(255, 255, 255, 0.85);
        }

        .nav-tab.active {
            background-color: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .nav-tab:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        /* Background image with opacity overlay */
        body {
            background-color: #0f172a;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("{{ url_for('static', filename='images/geminilogo.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.55) 0%, rgba(30, 64, 175, 0.25) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .page-content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body class="bg-slate-900">

    <!-- HEADER (with nav inline) -->
    <header class="header-gradient text-white sticky top-0" style="position: relative; z-index: 10;">

        <!-- ============================================================
             RESIZE CONTROL: Change `px-8 py-3` below to adjust padding.
             - px-8 = horizontal padding (left/right spacing)
             - py-3 = vertical padding (controls header height)
             To make the whole header taller: py-4, py-5, etc.
        ============================================================ -->
        <div class="max-w-screen-2xl mx-auto px-8 py-3 flex items-center gap-x-4">

            <!-- Logo + Title -->
            <!-- ============================================================
                 RESIZE: Change `text-2xl` to resize the "SuperAdmin" title.
                 Options: text-lg | text-xl | text-2xl | text-3xl
                 Change `w-12 h-12` to resize the logo box (e.g. w-10 h-10 = smaller).
            ============================================================ -->
            <div class="flex items-center gap-x-3 shrink-0">
                <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center overflow-hidden shadow border border-white/40">
                    <img src="{{ url_for('static', filename='images/cropted.png') }}"
                         alt="School Logo"
                         class="w-full h-full object-cover">
                </div>
                <h1 class="text-3xl font-semibold tracking-[-0.5px] whitespace-nowrap">DMRHS</h1>
            </div>


            <!-- Navigation tabs — CENTERED via flex-1 + justify-center -->
            <!-- ============================================================
                 RESIZE NAV ITEMS: Change `text-sm` on each <a> tag to resize nav text.
                 Options: text-xs | text-sm | text-base | text-lg
                 Change `px-4 py-2` to adjust nav tab padding (size of clickable area).
                 Change `gap-x-1` below to increase/decrease spacing between tabs: gap-x-2, gap-x-4, etc.
            ============================================================ -->
            <nav class="flex items-center justify-center gap-x-1 flex-1">

                <a href="{{ url_for('sadmin.index') }}"
                    class="nav-tab {% if request.endpoint == 'sadmin.index' %}active{% endif %} text-lg flex items-center gap-x-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap">
                    <i class="fa-solid fa-gauge"></i>
                    Dashboard
                </a>

                <a href="{{ url_for('sadmin.attendance') }}"
                    class="nav-tab {% if request.endpoint == 'sadmin.attendance' %}active{% endif %} flex items-center gap-x-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap">
                    <i class="fa-solid fa-layer-group"></i>
                    Attendance
                </a>

                <a href="{{ url_for('sadmin.uid') }}"
                    class="nav-tab {% if request.endpoint == 'sadmin.uid' %}active{% endif %} flex items-center gap-x-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap">
                    <i class="fa-solid fa-id-card"></i>
                    UID
                </a>

                <a href="{{ url_for('section_bp.section') }}"
                    class="nav-tab flex items-center gap-x-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap">
                    <i class="fa-solid fa-table-cells-large"></i>
                    Section
                </a>

                <a href="{{ url_for('sregister.student') }}"
                    class="nav-tab {% if request.endpoint == 'sregister.student' %}active{% endif %} flex items-center gap-x-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>

                <a href="{{ url_for('teacher_bp.teachers') }}"
                    class="nav-tab flex items-center gap-x-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    Teachers
                </a>

            </nav>

            <!-- Profile Button -->
            <!-- ============================================================
                 RESIZE: Change `h-9` to resize the profile button height.
                 Change `text-lg` on the initials span to resize the "HD" text.
            ============================================================ -->
            <div class="flex items-center relative shrink-0">
                <button type="button"
                    onclick="toggleDropdown()"
                    class="flex items-center gap-x-1 px-2 h-9 bg-white text-[#1e40af] rounded-2xl shadow-inner border border-white/30">
                    <span class="w-8 h-8 flex items-center justify-center font-bold text-lg">HD</span>
                    <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200" id="dropdownIcon"></i>
                </button>

                <!-- DROPDOWN -->
                <div id="profileDropdown"
                    class="hidden absolute right-0 top-12 w-52 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden z-50">
                    <a href="{{ url_for('sadmin.backup_database') }}"
                        class="flex items-center gap-x-3 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
                        <i class="fa-solid fa-database text-[#1e40af]"></i>
                        Backup Database
                    </a>
                    <a href="{{ url_for('sadmin.logout') }}"
                        class="flex items-center gap-x-3 px-4 py-3 text-sm font-medium text-red-600 hover:bg-red-50 transition border-t border-slate-100">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </div>
            </div>

        </div>
    </header>

    <!-- PAGE CONTENT -->
    <div class="page-content">
        {% block content %}{% endblock %}
    </div>

    <!-- SCRIPT -->
    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById("profileDropdown");
            const icon = document.getElementById("dropdownIcon");
            dropdown.classList.toggle("hidden");
            icon.classList.toggle("rotate-180");
        }

        document.addEventListener("click", function(event) {
            const dropdown = document.getElementById("profileDropdown");
            const button = event.target.closest("button[onclick='toggleDropdown()']");
            const icon = document.getElementById("dropdownIcon");
            if (!button && !dropdown.contains(event.target)) {
                dropdown.classList.add("hidden");
                icon.classList.remove("rotate-180");
            }
        });
    </script>

</body>
</html>
