<script>
function filterTable() {
  const input = document.getElementById('searchInput').value.toLowerCase().trim()
  const rows = document.querySelectorAll('#studentsTable tbody tr')

  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(input)
      ? ''
      : 'none'
  })
}

function exportToCSV() {

  const table = document.getElementById('studentsTable')

  const data = []

  data.push([
    "UID",
    "Full Name",
    "Section",
    "Year Level",
    "Birthday",
    "Contact",
    "Email",
    "Schedule",
    "Registered"
  ])

  const rows = table.querySelectorAll('tbody tr')

  rows.forEach(row => {

    if (row.style.display === 'none') return

    const cells = row.querySelectorAll('td')

    const uid =
      cells[0]?.innerText.trim() || ''

    const fullName =
      cells[1]?.innerText
        .replace(/\n/g, ' ')
        .replace(/\s+/g, ' ')
        .trim() || ''

    const section =
      cells[2]?.innerText.trim() || ''

    const yearLevel =
      cells[3]?.innerText.trim() || ''

    const birthday =
      cells[4]?.innerText.trim() || ''

    const contact =
      cells[5]?.innerText.trim() || ''

    const email =
      cells[6]?.innerText.trim() || ''

    const schedule =
      cells[7]?.innerText
        .replace(/\n/g, ' ')
        .replace(/\s+/g, ' ')
        .trim() || ''

    const registered =
      cells[8]?.innerText.trim() || ''

    data.push([
      uid,
      fullName,
      section,
      yearLevel,
      birthday,
      contact,
      email,
      schedule,
      registered
    ])
  })

  const ws = XLSX.utils.aoa_to_sheet(data)

  const range = XLSX.utils.decode_range(ws['!ref'])

  for (let R = 1; R <= range.e.r; R++) {

    const contactCell =
      XLSX.utils.encode_cell({
        r: R,
        c: 5
      })

    if (ws[contactCell]) {
      ws[contactCell].t = 's'
    }
  }

  ws['!cols'] = [
    { wch: 18 },
    { wch: 30 },
    { wch: 20 },
    { wch: 15 },
    { wch: 15 },
    { wch: 18 },
    { wch: 35 },
    { wch: 50 },
    { wch: 18 }
  ]

  const wb = XLSX.utils.book_new()

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Students"
  )

  XLSX.writeFile(
    wb,
    `students_${new Date().toISOString().slice(0,10)}.xlsx`
  )
}

function formatSchedule(schedule) {

  if (!schedule || schedule === '—')
    return '—'

  return schedule
    .replace(
      /,\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/g,
      '\n$1'
    )
    .trim()
}

function formatScheduleHtml(schedule) {

  return formatSchedule(schedule)
    .replace(/\n/g, '<br>')
}

function excelSerialToDate(serial) {

  const date_info =
    new Date(
      Math.floor(serial - 25569)
      * 86400 * 1000
    )

  const y =
    date_info.getUTCFullYear()

  const m =
    String(
      date_info.getUTCMonth() + 1
    ).padStart(2, '0')

  const d =
    String(
      date_info.getUTCDate()
    ).padStart(2, '0')

  return `${y}-${m}-${d}`
}

function normalizeBirthday(value) {

  const raw =
    String(value || '').trim()

  if (!raw) return ''

  if (
    /^\d{4}-\d{2}-\d{2}$/
      .test(raw)
  ) {
    return raw
  }

  if (
    /^\d+(\.\d+)?$/
      .test(raw)
  ) {
    return excelSerialToDate(
      parseFloat(raw)
    )
  }

  const parsed =
    new Date(raw)

  if (
    !isNaN(parsed.getTime())
  ) {

    return `${parsed.getFullYear()}-${
      String(
        parsed.getMonth() + 1
      ).padStart(2,'0')
    }-${
      String(
        parsed.getDate()
      ).padStart(2,'0')
    }`
  }

  return raw
}

function triggerImportFile() {

  const input =
    document.createElement(
      'input'
    )

  input.type = 'file'

  input.accept =
    '.csv,.xlsx,.xls'

  input.onchange =
    function(e) {

      const file =
        e.target.files[0]

      if (!file) return

      const reader =
        new FileReader()

      const isExcel =
        /\.(xlsx|xls)$/i
          .test(file.name)

      if (isExcel) {

        reader.onload =
          ev => {

            const wb =
              XLSX.read(
                new Uint8Array(
                  ev.target.result
                ),
                {
                  type: 'array'
                }
              )

            processImportedSheet(
              wb,
              file.name
            )
          }

        reader.readAsArrayBuffer(
          file
        )

      } else {

        reader.onload =
          ev => {

            const wb =
              XLSX.read(
                ev.target.result,
                {
                  type: 'string'
                }
              )

            processImportedSheet(
              wb,
              file.name
            )
          }

        reader.readAsText(file)
      }
    }

  input.click()
}

function processImportedSheet(
  wb,
  filename
) {

  const ws =
    wb.Sheets[
      wb.SheetNames[0]
    ]

  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header: 1,
        defval: ''
      }
    )

  parseAndImport(
    rows,
    filename
  )
}

function parseAndImport(
  rows,
  filename
) {

  if (rows.length < 2) {

    alert(
      '❌ No data found in the file.'
    )

    return
  }

  const headers =
    rows[0].map(
      h =>
        (h || '')
          .toString()
          .trim()
          .toLowerCase()
    )

  const students = []

  for (
    let row of rows.slice(1)
  ) {

    if (
      !row ||
      row.every(
        cell =>
          cell === '' ||
          cell == null
      )
    ) {
      continue
    }

    const student = {}

    headers.forEach(
      (header, i) => {

        const value =
          (row[i] ?? '')
            .toString()
            .trim()

        if (!value) return

        if (
          header.includes('last')
        ) {
          student.last_name =
            value
        }

        else if (
          header.includes('first')
        ) {
          student.first_name =
            value
        }

        else if (
          header.includes('middle')
        ) {
          student.middle_name =
            value
        }

        else if (
          header.includes('extension')
          ||
          header.includes('ext')
        ) {
          student.extension =
            value
        }

        else if (
          header.includes('birth')
        ) {
          student.birthday =
            normalizeBirthday(
              value
            )
        }

        else if (
          header.includes('contact')
          ||
          header.includes('phone')
          ||
          header.includes('number')
        ) {
          student.contact_number =
            value
        }

        else if (
          header.includes('email')
        ) {
          student.email =
            value
        }

        else if (
          header.includes('schedule')
          ||
          header.includes('sched')
        ) {
          student.schedule =
            value
        }

        else if (
          header.includes('section')
        ) {
          student.section_name =
            value
        }

        else if (
          header.includes('year')
        ) {
          student.year_level =
            value
        }
      }
    )

    if (
      student.last_name &&
      student.first_name &&
      student.birthday &&
      student.contact_number &&
      student.email &&
      student.schedule
    ) {
      students.push(student)
    }
  }

  if (
    students.length === 0
  ) {

    alert(
      '❌ No valid student rows found.'
    )

    return
  }

  if (
    confirm(
      `✅ Found ${students.length} students in "${filename}".\n\nImport them now?`
    )
  ) {

    fetch(
      '/superadmin/import-excel',
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body: JSON.stringify({
          students
        })
      }
    )

    .then(async res => {

      const data =
        await res.json()
          .catch(() => ({}))

      if (!res.ok) {

        throw new Error(
          data.message
          ||
          'Import failed.'
        )
      }

      return data
    })

    .then(data => {

      alert(
        data.message
        ||
        `🎉 Successfully imported ${students.length} students!`
      )

      window.location.reload()
    })

    .catch(err => {

      alert(
        `❌ ${
          err.message
          ||
          'Import failed.'
        }`
      )
    })
  }
}
