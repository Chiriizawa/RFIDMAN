<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}RFID Attendance System | Don Manuel Rivera School{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * { 
            font-family: 'Inter', system-ui, sans-serif; 
        }

        body {
            background-image: url("{{ url_for('static', filename='images/bg.png') }}");
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            background-color: #1e293b;
            min-height: 100vh;
        }

        /* Dark overlay to make content readable */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(30, 41, 59, 0.75),
                rgba(15, 23, 42, 0.85)
            );
            z-index: -1;
        }

        .main-content {
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }

        .header-gradient {
            background: linear-gradient(135deg, #1e40af, #312e81);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="relative min-h-screen">

    <!-- Background Overlay -->
    <div class="overlay"></div>

    <div class="main-content container mx-auto px-4 py-8 max-w-7xl min-h-screen">
        {% block content %}{% endblock %}
    </div>

    <!-- Optional Footer -->
    <footer class="relative z-10 text-white/80 text-center py-6 text-sm border-t border-white/10 mt-auto">
        <div class="flex flex-col md:flex-row justify-center items-center gap-4">
            <span>Don Manuel Rivera Memorial Integrated National High School</span>
            <span class="hidden md:inline">•</span>
            <span>Pila, Laguna, Philippines</span>
        </div>
    </footer>

</body>
</html>
