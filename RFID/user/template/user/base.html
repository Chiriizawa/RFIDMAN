<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RFID Attendance System{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .white-card {
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .header-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%);
            padding: 1.5rem 2rem;
        }
        
        .text-accent {
            color: #f59e0b;
        }
        
        .status-card {
            transition: all 0.3s ease;
            padding: 1.25rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
        }
        
        .status-card:hover {
            transform: translateY(-5px);
            background: #f1f5f9;
            border-color: #f59e0b;
        }
        
        .btn-primary {
            background: #f59e0b;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary:hover {
            background: #d97706;
            transform: translateY(-2px);
        }
        
        .present-badge {
            background: #dcfce7;
            color: #166534;
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(30, 58, 138, 0.95);
            backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .toast.success { background: linear-gradient(135deg, rgba(16, 185, 129, 0.95), rgba(5, 150, 105, 0.95)); }
        .toast.error { background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(220, 38, 38, 0.95)); }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
