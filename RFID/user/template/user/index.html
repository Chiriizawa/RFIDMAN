<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RFID Attendance System | Don Manuel Rivera School</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { 
            font-family: 'Inter', system-ui, sans-serif; 
        }

        body {
            background-image: url("{{ url_for('static', filename='images/bg.png') }}");
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            background-color: #1e293b;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(30, 41, 59, 0.78), rgba(15, 23, 42, 0.88));
            z-index: -1;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.35);
            max-width: 480px;
            margin: 40px auto;
            overflow: hidden;
            border-radius: 24px;
        }

        .success-flash {
            animation: successPop 0.5s ease;
        }

        @keyframes successPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="relative">

    <div class="overlay"></div>

    <div class="min-h-screen flex items-center justify-center p-6 relative z-10">
        <div class="main-card">
            
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-700 to-indigo-700 px-8 py-5 text-white">
                <div class="flex items-center gap-3">
                    <i class="fas fa-id-card text-3xl"></i>
                    <div>
                        <h1 class="text-2xl font-bold">RFID Attendance</h1>
                        <p class="text-blue-100 text-sm">Don Manuel Rivera Memorial Integrated NHS</p>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="p-8 text-center">
                
                <!-- Waiting State -->
                <div id="scanner-area" class="mb-8">
                    <div class="w-20 h-20 mx-auto bg-blue-100 rounded-3xl flex items-center justify-center mb-5">
                        <i class="fas fa-rfid text-5xl text-blue-600"></i>
                    </div>
                    <p id="status-text" class="text-lg font-medium text-gray-600">Waiting for RFID tap...</p>
                </div>

                <!-- Success Result - Now Much Smaller & Compact -->
                <div id="result-area" class="hidden">
                    <div class="success-flash bg-emerald-50 border border-emerald-200 rounded-2xl p-6 mb-6">
                        <i class="fas fa-check-circle text-5xl text-emerald-500 mb-3"></i>
                        
                        <h2 id="room-name" class="text-2xl font-bold text-gray-800 mb-1">
                            <!-- Room name -->
                        </h2>
                        <p class="text-emerald-600 text-sm font-medium mb-4">Successfully marked present</p>
                        
                        <!-- Compact Info Box -->
                        <div class="bg-white rounded-xl p-4 text-sm">
                            <div class="flex justify-between items-center py-2 border-b border-gray-100">
                                <span class="text-gray-500">Time In</span>
                                <span id="time-in" class="font-mono font-semibold text-gray-800"></span>
                            </div>
                            <div class="flex justify-between items-center py-2">
                                <span class="text-gray-500">Student UID</span>
                                <span id="uid-display" class="font-mono text-gray-700"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Manual Testing -->
                
            </div>

            <!-- Footer -->
            <div class="bg-white/70 px-8 py-4 text-center text-sm text-gray-600 border-t">
                <span id="live-status" class="inline-flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    Reader is online • Listening...
                </span>
            </div>
        </div>
    </div>

    <script>
        let lastUid = '';

        async function fetchStatus() {
            try {
                const res = await fetch('/user/status');
                const data = await res.json();
                
                const resultArea = document.getElementById('result-area');
                const scannerArea = document.getElementById('scanner-area');
                
                if (data.uid && data.uid !== 'Waiting for RFID card...' && data.uid !== lastUid) {
                    lastUid = data.uid;
                    
                    scannerArea.classList.add('hidden');
                    resultArea.classList.remove('hidden');
                    
                    document.getElementById('uid-display').textContent = data.uid;
                    document.getElementById('time-in').textContent = new Date().toLocaleTimeString([], {
                        hour: '2-digit', 
                        minute: '2-digit'
                    });
                    
                    // Change this later to real room logic
                    document.getElementById('room-name').textContent = "Room 101 - Programming Lab";
                    
                    // Auto hide after 6 seconds (shorter now)
                    setTimeout(() => {
                        resultArea.classList.add('hidden');
                        scannerArea.classList.remove('hidden');
                        document.getElementById('status-text').textContent = "Waiting for next tap...";
                    }, 6000);
                }
            } catch (e) {
                console.error("Error:", e);
            }
        }

        function manualTap() {
            const uid = document.getElementById('manual-uid').value.trim().toUpperCase();
            if (!uid) return;
            
            document.getElementById('manual-uid').value = '';
            
            const resultArea = document.getElementById('result-area');
            const scannerArea = document.getElementById('scanner-area');
            
            scannerArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            
            document.getElementById('uid-display').textContent = uid;
            document.getElementById('time-in').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            document.getElementById('room-name').textContent = "Room 101 - Programming Lab";
            
            setTimeout(() => {
                resultArea.classList.add('hidden');
                scannerArea.classList.remove('hidden');
            }, 6000);
        }

        setInterval(fetchStatus, 1000);

        window.onload = () => {
            fetchStatus();
        };
    </script>
</body>
</html>
