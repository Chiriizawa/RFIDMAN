{% extends "user/base.html" %}

{% block title %}RFID Card Reader{% endblock %}

{% block content %}

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --border: #e5e7eb;
    --accent: #2563eb;
    --success: #16a34a;
    --danger: #dc2626;
    --text: #111827;
    --muted: #6b7280;

    --font-mono: 'Share Tech Mono', monospace;
    --font-ui: 'Rajdhani', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
  }

  .container {
    width: 100%;
    max-width: 680px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .header {
    text-align: center;
  }

  .header .label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .header h1 {
    font-size: 2.2rem;
    font-weight: 700;
  }

  .header h1 span {
    color: var(--accent);
  }

  .scan-zone {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .card-icon {
    width: 100px;
    height: 70px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    position: relative;
  }

  .card-icon.success { border-color: var(--success); }
  .card-icon.error { border-color: var(--danger); }

  .card-icon::after {
    content: '';
    width: 30px;
    height: 20px;
    border: 2px solid currentColor;
    border-radius: 4px;
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
  }

  .card-icon .chip {
    width: 20px;
    height: 16px;
    background: #ddd;
    border-radius: 3px;
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
  }

  .uid-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--muted);
  }

  .uid-value {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    color: var(--accent);
  }

  .uid-value.waiting { color: var(--muted); }
  .uid-value.success { color: var(--success); }
  .uid-value.error { color: var(--danger); }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 1rem;
    border-radius: 999px;
    font-size: 0.8rem;
    border: 1px solid var(--border);
  }

  .status-badge.active {
    color: var(--success);
    border-color: var(--success);
  }

  .status-badge.reading {
    color: var(--accent);
    border-color: var(--accent);
  }

  .status-badge.error {
    color: var(--danger);
    border-color: var(--danger);
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .info-panel {
    display: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
  }

  .info-panel.visible { display: block; }

  .row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
  }

  .row-label {
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .manual {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
  }

  .manual-row {
    display: flex;
    gap: 0.5rem;
  }

  .manual input {
    flex: 1;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .manual button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .log {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem;
    max-height: 150px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }
</style>

<div class="container">

  <div class="header">
    <div class="label">System Status</div>
    <h1>RFID <span>Scanner</span></h1>
  </div>

  <div class="scan-zone">
    <div class="card-icon" id="cardIcon">
      <div class="chip"></div>
    </div>

    <div>
      <div class="uid-label">Last Scanned UID</div>
      <div class="uid-value waiting" id="uidDisplay">Waiting...</div>
    </div>

    <div class="status-badge reading" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Listening</span>
    </div>
  </div>

  <div class="info-panel" id="infoPanel">
    <div class="row">
      <span class="row-label">Record ID</span>
      <span id="infoId">—</span>
    </div>
    <div class="row">
      <span class="row-label">UID</span>
      <span id="infoUid">—</span>
    </div>
    <div class="row">
      <span class="row-label">Tapped At</span>
      <span id="infoTime">—</span>
    </div>
  </div>

  <div class="manual">
    <div class="manual-row">
      <input type="text" id="manualUid" placeholder="Enter UID"/>
      <button onclick="manualTap()">Tap</button>
    </div>
  </div>

  <div class="log" id="log">No events yet…</div>

</div>

<script>
let lastUid = null;

/* LOG */
function logEvent(msg) {
  const log = document.getElementById('log');
  const entry = document.createElement('div');
  entry.textContent = new Date().toLocaleTimeString() + " - " + msg;
  log.prepend(entry);
}

/* SUCCESS */
function setSuccess(uid) {
  document.getElementById('uidDisplay').textContent = uid;
  document.getElementById('uidDisplay').className = 'uid-value success';
  document.getElementById('cardIcon').className = 'card-icon success';
  logEvent("UID " + uid + " scanned");
}

/* MANUAL TAP */
function manualTap() {
  const uid = document.getElementById('manualUid').value;
  if (!uid) return;
  setSuccess(uid);
}
</script>

{% endblock %}
