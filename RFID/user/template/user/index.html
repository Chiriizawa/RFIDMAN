<!DOCTYPE html>
<html>
<head>
    <title>RFID Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

<div class="text-center">
    <h1 class="text-3xl font-bold mb-4">RFID LIVE SUPABASE</h1>

    <div class="text-5xl font-mono bg-gray-800 p-6 rounded-xl">
        <span id="uid">Waiting...</span>
    </div>
</div>

<script>
function loadUID() {
    fetch('/user/get_uid')
        .then(res => res.json())
        .then(data => {
            document.getElementById("uid").innerText = data.uid;
        });
}

setInterval(loadUID, 1000);
loadUID();
</script>

</body>
</html>
