{% extends "base.html" %}

{% block title %}Scan History{% endblock %}

{% block content %}
<style>
    .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        min-width: 300px;
        max-width: 450px;
        padding: 16px 20px;
        border-radius: 16px;
        background: rgba(30, 58, 138, 0.95);
        backdrop-filter: blur(18px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 12px;
        animation: slideInRight 0.3s ease;
        border: 1px solid rgba(255,255,255,0.15);
    }
    
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    
    .toast.success { background: linear-gradient(135deg, rgba(16, 185, 129, 0.95), rgba(5, 150, 105, 0.95)); }
    .toast.error { background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(220, 38, 38, 0.95)); }
    .toast.info { background: linear-gradient(135deg, rgba(59, 130, 246, 0.95), rgba(37, 99, 235, 0.95)); }
    .toast.warning { background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(217, 119, 6, 0.95)); }
    
    .toast-icon { font-size: 24px; flex-shrink: 0; }
    .toast-content { flex: 1; }
    .toast-title { font-weight: 600; margin-bottom: 4px; font-size: 14px; color: white; }
    .toast-message { font-size: 13px; opacity: 0.95; color: white; }
    .toast-close { cursor: pointer; opacity: 0.7; font-size: 18px; color: white; }
    .toast-close:hover { opacity: 1; }
    
    .white-card { background: white; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    .header-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%); padding: 1.5rem 2rem; }
    .text-accent { color: #f59e0b; }
    
    .table-header { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    .table-header th { color: #1e293b; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 1rem 1.5rem; }
    .table-row { border-bottom: 1px solid #e2e8f0; transition: all 0.2s ease; }
    .table-row:hover { background: #f8fafc; }
    .table-row td { padding: 1rem 1.5rem; color: #1e293b; font-size: 0.9rem; }
    
    .uid-badge { background: #fef3c7; color: #92400e; font-family: monospace; font-weight: 700; padding: 0.5rem 1rem; border-radius: 0.75rem; display: inline-block; border: 1px solid #fbbf24; font-size: 0.85rem; }
    .empty-state { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 2rem; text-align: center; }
    .total-badge { background: #fef3c7; border: 1px solid #fbbf24; color: #92400e; padding: 0.5rem 1.5rem; border-radius: 2rem; font-size: 0.875rem; font-weight: 600; }
    .total-badge span { color: #d97706; font-weight: 800; margin-left: 0.5rem; font-size: 1rem; }
    
    .search-bar { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.6rem 1rem; color: #1e293b; width: 300px; transition: all 0.2s ease; }
    .search-bar:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
    .search-bar::placeholder { color: #94a3b8; }
    
    .action-btn { background: #f8fafc; border: 1px solid #e2e8f0; color: #1e293b; padding: 0.5rem 1rem; border-radius: 0.75rem; cursor: pointer; transition: all 0.2s ease; font-size: 0.875rem; }
    .action-btn:hover { background: #fef3c7; border-color: #f59e0b; color: #d97706; transform: translateY(-1px); }
    
    .live-indicator { display: inline-flex; align-items: center; gap: 8px; background: #dcfce7; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; color: #166534; }
    .pulse-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
    
    @media (max-width: 768px) {
        .table-header th, .table-row td { padding: 0.75rem 1rem; }
        .header-gradient { padding: 1rem 1.25rem; }
        .search-bar { width: 100%; }
    }
</style>

<div class="max-w-7xl mx-auto px-4">
    <div class="white-card">
        <div class="header-gradient text-white">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div>
                    <h1 class="text-2xl font-semibold flex items-center gap-3">
                        <i class="fa-solid fa-clock-rotate-left text-accent"></i>
                        Scan History
                    </h1>
                    <p class="text-white/80 mt-1 text-sm">Real-time RFID scan records • One entry per student per day</p>
                </div>
                <div class="live-indicator">
                    <div class="pulse-dot"></div>
                    <span>Live Updates</span>
                </div>
            </div>
        </div>

        <div class="p-6">
            <div class="mb-6 flex justify-between items-center gap-4 flex-wrap">
                <div class="relative flex-1 max-w-md">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" onkeyup="filterHistory()" placeholder="Search by UID, student name..." class="search-bar pl-10 w-full">
                </div>
                <div class="flex gap-2">
                    <button onclick="exportHistory()" class="action-btn"><i class="fa-solid fa-download mr-2"></i>Export CSV</button>
                    <button onclick="printHistory()" class="action-btn"><i class="fa-solid fa-print mr-2"></i>Print</button>
                    <button onclick="refreshHistory()" class="action-btn"><i class="fa-solid fa-rotate-right mr-2"></i>Refresh</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full min-w-full text-sm" id="historyTable">
                    <thead>
                        <tr class="table-header">
                            <th class="text-left w-16">#</th>
                            <th class="text-left w-32">UID</th>
                            <th class="text-left">Student Name</th>
                            <th class="text-left w-48">Scan Date</th>
                            <th class="text-left w-32">Scan Time</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-gray-100">
                        <tr><td colspan="5" class="text-center py-8"><div class="empty-state"><i class="fa-regular fa-clock text-4xl text-gray-400 mb-3"></i><p class="text-gray-500">Loading scan history...</p></div></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-6 flex justify-between items-center gap-4 flex-wrap">
                <div class="text-gray-600 text-sm"><i class="fa-solid fa-info-circle mr-1"></i>Showing <span id="visibleCount">0</span> of <span id="totalCount">0</span> scans</div>
                <div class="total-badge"><i class="fa-solid fa-id-card mr-2"></i>Total Scans: <span id="totalScans">0</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    let allScans = [];
    
    function showToast(message, type = 'success', title = '') {
        const titles = { success: '✓ Success!', error: '✗ Error!', info: 'ℹ Info', warning: '⚠ Warning' };
        const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<div class="toast-icon">${icons[type] || icons.success}</div><div class="toast-content"><div class="toast-title">${title || titles[type]}</div><div class="toast-message">${message}</div></div><div class="toast-close" onclick="this.parentElement.remove()">✕</div>`;
        document.body.appendChild(toast);
        setTimeout(() => { if (toast && toast.parentElement) { toast.style.animation = 'slideOutRight 0.3s ease'; setTimeout(() => toast.remove(), 300); } }, 3000);
    }
    
    async function fetchHistory() {
        try {
            const response = await fetch('/admin/history/api');
            const data = await response.json();
            if (data.success) {
                if (allScans.length > 0 && data.history.length > allScans.length) showToast(`New scan detected!`, 'success', 'New Record');
                allScans = data.history;
                renderHistoryTable(allScans);
                updateStats(allScans);
            }
        } catch (error) { console.error('Error fetching history:', error); }
    }
    
    function renderHistoryTable(scans) {
        const tbody = document.getElementById('historyTableBody');
        if (!scans || scans.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8"><div class="empty-state"><i class="fa-regular fa-clock text-4xl text-gray-400 mb-3"></i><p class="text-gray-500">No scan records found</p><p class="text-gray-400 text-sm mt-2">Scan an RFID card to see records</p></div></td></tr>`;
            return;
        }
        tbody.innerHTML = scans.map((scan, index) => `<tr class="table-row"><td class="font-medium">${index + 1}</td><td><span class="uid-badge"><i class="fa-solid fa-id-card mr-1 text-xs"></i>${scan.uid}</span></td><td class="font-medium"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-amber-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-user text-amber-600 text-sm"></i></div>${scan.full_name || 'Unregistered Card'}</div></td><td><i class="fa-regular fa-calendar mr-1 text-gray-400"></i>${scan.scan_date}</td><td><i class="fa-regular fa-clock mr-1 text-gray-400"></i>${scan.scan_time}</td></tr>`).join('');
    }
    
    function updateStats(scans) {
        document.getElementById('totalCount').textContent = scans.length;
        document.getElementById('totalScans').textContent = scans.length;
        document.getElementById('visibleCount').textContent = scans.length;
    }
    
    function filterHistory() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allScans.filter(scan => scan.uid?.toLowerCase().includes(filter) || scan.full_name?.toLowerCase().includes(filter));
        renderHistoryTable(filtered);
        document.getElementById('visibleCount').textContent = filtered.length;
        if (filter && filtered.length === 0) showToast('No scans found matching your search', 'info', 'No Results');
    }
    
    function exportHistory() {
        if (allScans.length === 0) { showToast('No data to export', 'warning', 'Export Failed'); return; }
        let csvContent = "#,UID,Student Name,Scan Date,Scan Time\n";
        allScans.forEach((scan, index) => { csvContent += `${index + 1},"${scan.uid}","${scan.full_name || 'Unregistered Card'}","${scan.scan_date}","${scan.scan_time}"\n`; });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `scan_history_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); window.URL.revokeObjectURL(url);
        showToast(`Exported ${allScans.length} scan records`, 'success', 'Export Complete');
    }
    
    function printHistory() {
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`<html><head><title>Scan History Report</title><style>body{font-family:Arial;margin:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f2f2f2}h1{color:#1e3a8a}</style></head><body><h1>Scan History Report</h1><p>Generated: ${new Date().toLocaleString()}</p><p>Total Scans: ${allScans.length}</p>${document.getElementById('historyTable').outerHTML}<p>Tap & Know System</p></body></html>`);
        printWindow.document.close(); printWindow.print();
        showToast('Print window opened', 'info', 'Print Ready');
    }
    
    function refreshHistory() { fetchHistory(); showToast('History refreshed', 'info', 'Refreshing'); }
    
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'f') { e.preventDefault(); document.getElementById('searchInput').focus(); showToast('Search focused', 'info', 'Search Mode'); }
        else if (e.ctrlKey && e.key === 'e') { e.preventDefault(); exportHistory(); }
        else if (e.ctrlKey && e.key === 'p') { e.preventDefault(); printHistory(); }
    });
    
    fetchHistory();
    setInterval(fetchHistory, 3000);
</script>
{% endblock %}
