<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Tap &amp; Know</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-image: url("{{ url_for('static', filename='images/geminilogo.png') }}");
            position: relative;
            display: flex;
            align-items: center;  /* Changed from flex-start to center */
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(10,20,60,0.85) 0%, rgba(0,0,0,0.70) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.5s ease;
            margin: auto;  /* Added to ensure centering */
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .glass-input {
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.20);
            color: #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.85rem 1.25rem;
            width: 100%;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        
        .glass-input:focus { 
            border-color: #facc15;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.1);
        }
        
        .glass-input::placeholder { 
            color: rgba(148,163,184,0.7);
        }
        
        .login-btn {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .login-btn:hover::before { left: 100%; }
        
        .login-btn:hover {
            background: linear-gradient(135deg, #1e40af 0%, #2e2a6e 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4);
        }
        
        .login-btn:active { transform: translateY(0); }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            max-width: 450px;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(30, 58, 138, 0.95);
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
        
        @keyframes slideOutRight {
            from { transform: translateX(0);    opacity: 1; }
            to   { transform: translateX(100%); opacity: 0; }
        }
        
        .toast.success { background: linear-gradient(135deg, rgba(16,185,129,0.95), rgba(5,150,105,0.95)); }
        .toast.error   { background: linear-gradient(135deg, rgba(239,68,68,0.95), rgba(220,38,38,0.95)); }
        .toast.warning { background: linear-gradient(135deg, rgba(245,158,11,0.95), rgba(217,119,6,0.95)); }

        .toast-icon    { font-size: 24px; flex-shrink: 0; }
        .toast-content { flex: 1; }
        .toast-title   { font-weight: 600; margin-bottom: 4px; font-size: 14px; color: white; }
        .toast-message { font-size: 13px; opacity: 0.95; color: white; }
        .toast-close   { cursor: pointer; opacity: 0.7; transition: opacity 0.2s; font-size: 18px; flex-shrink: 0; color: white; }
        .toast-close:hover { opacity: 1; }

        .btn-loading { position: relative; pointer-events: none; opacity: 0.7; }
        .btn-loading::after {
            content: "";
            position: absolute;
            width: 18px; height: 18px;
            top: 50%; right: 20px;
            margin-top: -9px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .password-wrapper { position: relative; }
        .password-toggle {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: color 0.2s;
        }
        .password-toggle:hover { color: #facc15; }

        .db-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: rgba(148,163,184,0.8);
        }
        .db-badge .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #34d399;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="glass-card p-10">
            <h2 class="text-3xl font-semibold text-center text-white mb-2">
                <i class="fa-solid fa-chalkboard-user mr-2 text-yellow-400"></i>
                Teachers Login
            </h2>
            <p class="text-center text-blue-300 mb-6">Access your teaching profile</p>

            <div class="flex justify-center mb-6">
                <span class="db-badge">
                    <span class="dot"></span>
                    Connected to secure database
                </span>
            </div>

            <form id="loginForm" method="POST" action="{{ url_for('admin_bp.teacher_login') }}" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-blue-200 mb-2">
                        <i class="fa-solid fa-envelope mr-1 text-yellow-400/70"></i>
                        Email Address
                    </label>
                    <input type="email" name="identifier" id="email" required
                           placeholder="you@school.edu"
                           autocomplete="email"
                           class="glass-input">
                </div>

                <div>
                    <label class="block text-sm font-medium text-blue-200 mb-2">
                        <i class="fa-solid fa-lock mr-1 text-yellow-400/70"></i>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" required
                               placeholder="••••••••"
                               autocomplete="current-password"
                               class="glass-input pr-12">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fa-regular fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="loginBtn"
                        class="login-btn w-full text-white font-semibold py-4 rounded-2xl transition">
                    <i class="fa-solid fa-sign-in-alt mr-2"></i>
                    Sign In
                </button>
            </form>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="flash-msg hidden"
                         data-category="{{ category }}"
                         data-message="{{ message }}">
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <p class="text-center text-blue-400/60 text-sm mt-6">
            Authorized teachers only
        </p>
    </div>

    <script>
        function showToast(message, type = 'success', title = '') {
            const titles  = { success: '✓ Success!', error: '✗ Error!', info: 'ℹ Info', warning: '⚠ Warning' };
            const icons   = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.success}</div>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <div class="toast-close" onclick="dismissToast(this.parentElement)">✕</div>
            `;

            document.body.appendChild(toast);
            setTimeout(() => dismissToast(toast), 4000);
        }

        function dismissToast(toast) {
            if (!toast || !toast.parentElement) return;
            toast.style.animation = 'slideOutRight 0.3s ease forwards';
            setTimeout(() => toast.remove(), 300);
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('toggleIcon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isHidden);
            icon.classList.toggle('fa-eye-slash', isHidden);
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn      = document.getElementById('loginBtn');

            if (!email) {
                e.preventDefault();
                showToast('Please enter your email address.', 'warning', 'Missing Field');
                document.getElementById('email').focus();
                return;
            }

            if (!password) {
                e.preventDefault();
                showToast('Please enter your password.', 'warning', 'Missing Field');
                document.getElementById('password').focus();
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                e.preventDefault();
                showToast('Please enter a valid email address.', 'warning', 'Invalid Email');
                document.getElementById('email').focus();
                return;
            }

            btn.classList.add('btn-loading');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Signing In...';
        });

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('email').focus();

            document.querySelectorAll('.flash-msg').forEach(el => {
                const category = el.dataset.category;
                const message  = el.dataset.message;
                const type     = category === 'error' ? 'error' : 'success';
                const title    = category === 'error' ? 'Login Failed' : 'Notice';
                showToast(message, type, title);
            });
        });
    </script>
</body>
</html>
