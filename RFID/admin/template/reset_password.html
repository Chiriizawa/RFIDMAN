<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Tap & Know</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-image: url("{{ url_for('static', filename='images/geminilogo.png') }}");
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(10,20,60,0.85) 0%, rgba(0,0,0,0.70) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .reset-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.5s ease;
            margin: auto;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .glass-input {
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.20);
            color: #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.85rem 1.25rem;
            width: 100%;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        
        .glass-input:focus { 
            border-color: #facc15;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.1);
        }
        
        .glass-input::placeholder { 
            color: rgba(148,163,184,0.7);
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .reset-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .reset-btn:hover::before { left: 100%; }
        
        .reset-btn:hover {
            background: linear-gradient(135deg, #1e40af 0%, #2e2a6e 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4);
        }
        
        .reset-btn:active { transform: translateY(0); }

        .password-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .password-toggle:hover { color: #facc15; }

        .strength-meter {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-text {
            font-size: 11px;
            margin-top: 5px;
            color: rgba(148,163,184,0.8);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            max-width: 450px;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(30, 58, 138, 0.95);
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
        
        @keyframes slideOutRight {
            from { transform: translateX(0);    opacity: 1; }
            to   { transform: translateX(100%); opacity: 0; }
        }
        
        .toast.success { background: linear-gradient(135deg, rgba(16,185,129,0.95), rgba(5,150,105,0.95)); }
        .toast.error   { background: linear-gradient(135deg, rgba(239,68,68,0.95), rgba(220,38,38,0.95)); }
        
        .toast-icon    { font-size: 24px; flex-shrink: 0; }
        .toast-content { flex: 1; }
        .toast-title   { font-weight: 600; margin-bottom: 4px; font-size: 14px; color: white; }
        .toast-message { font-size: 13px; opacity: 0.95; color: white; }
        .toast-close   { cursor: pointer; opacity: 0.7; transition: opacity 0.2s; font-size: 18px; flex-shrink: 0; color: white; }
        .toast-close:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="reset-wrapper">
        <div class="glass-card p-10">
            <div class="text-center mb-6">
                <i class="fa-solid fa-key text-yellow-400 text-5xl mb-3"></i>
                <h2 class="text-3xl font-semibold text-white">Reset Password</h2>
                <p class="text-blue-300 mt-2">Create a new secure password</p>
            </div>

            <form method="POST" action="{{ url_for('admin_bp.reset_password', token=token) }}" id="resetForm">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-blue-200 mb-2">
                            <i class="fa-solid fa-lock mr-1 text-yellow-400/70"></i>
                            New Password
                        </label>
                        <div class="password-wrapper">
                            <input type="password" name="password" id="password" required
                                   placeholder="At least 6 characters"
                                   class="glass-input pr-12">
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                <i class="fa-regular fa-eye" id="toggleIconPassword"></i>
                            </button>
                        </div>
                        <div class="strength-meter">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-blue-200 mb-2">
                            <i class="fa-solid fa-check-circle mr-1 text-yellow-400/70"></i>
                            Confirm New Password
                        </label>
                        <div class="password-wrapper">
                            <input type="password" name="confirm_password" id="confirmPassword" required
                                   placeholder="Confirm your password"
                                   class="glass-input pr-12">
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                                <i class="fa-regular fa-eye" id="toggleIconConfirm"></i>
                            </button>
                        </div>
                        <div id="passwordMatchMsg" class="text-xs mt-1"></div>
                    </div>

                    <button type="submit" id="resetBtn"
                            class="reset-btn w-full text-white font-semibold py-4 rounded-2xl transition">
                        <i class="fa-solid fa-rotate-right mr-2"></i>
                        Reset Password
                    </button>
                    
                    <p class="text-center mt-4">
                        <a href="{{ url_for('admin_bp.teacher_login') }}" class="text-yellow-400 hover:underline text-sm">
                            <i class="fa-solid fa-arrow-left mr-1"></i>
                            Back to Login
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showToast(message, type = 'success', title = '') {
            const titles = { success: '✓ Success!', error: '✗ Error!' };
            const icons = { success: '✅', error: '❌' };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.success}</div>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <div class="toast-close" onclick="dismissToast(this.parentElement)">✕</div>
            `;

            document.body.appendChild(toast);
            setTimeout(() => dismissToast(toast), 4000);
        }

        function dismissToast(toast) {
            if (!toast || !toast.parentElement) return;
            toast.style.animation = 'slideOutRight 0.3s ease forwards';
            setTimeout(() => toast.remove(), 300);
        }

        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById(`toggleIcon${fieldId === 'password' ? 'Password' : 'Confirm'}`);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isHidden);
            icon.classList.toggle('fa-eye-slash', isHidden);
        }

        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d/)) strength++;
            if (password.match(/[^a-zA-Z\d]/)) strength++;
            
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let width = 0;
            let color = '';
            let text = '';
            
            switch(strength) {
                case 0:
                case 1:
                    width = 20;
                    color = '#ef4444';
                    text = 'Weak password';
                    break;
                case 2:
                    width = 40;
                    color = '#f59e0b';
                    text = 'Fair password';
                    break;
                case 3:
                    width = 60;
                    color = '#facc15';
                    text = 'Good password';
                    break;
                case 4:
                    width = 80;
                    color = '#34d399';
                    text = 'Strong password';
                    break;
                case 5:
                    width = 100;
                    color = '#10b981';
                    text = 'Very strong password';
                    break;
            }
            
            if (password.length === 0) {
                width = 0;
                text = '';
            }
            
            strengthBar.style.width = width + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = text;
            
            return strength;
        }
        
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const matchMsg = document.getElementById('passwordMatchMsg');
            
            if (confirm.length === 0) {
                matchMsg.innerHTML = '';
                return false;
            }
            
            if (password === confirm) {
                matchMsg.innerHTML = '<i class="fa-solid fa-check-circle mr-1"></i>Passwords match';
                matchMsg.className = 'text-green-400 text-xs mt-1';
                return true;
            } else {
                matchMsg.innerHTML = '<i class="fa-solid fa-exclamation-circle mr-1"></i>Passwords do not match';
                matchMsg.className = 'text-red-400 text-xs mt-1';
                return false;
            }
        }
        
        document.getElementById('password').addEventListener('input', function() {
            checkPasswordStrength(this.value);
            checkPasswordMatch();
        });
        
        document.getElementById('confirmPassword').addEventListener('input', function() {
            checkPasswordMatch();
        });
        
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            
            if (!password) {
                e.preventDefault();
                showToast('Please enter a new password.', 'error', 'Missing Field');
                return;
            }
            
            if (password.length < 6) {
                e.preventDefault();
                showToast('Password must be at least 6 characters long.', 'error', 'Invalid Password');
                return;
            }
            
            if (password !== confirm) {
                e.preventDefault();
                showToast('Passwords do not match.', 'error', 'Validation Error');
                return;
            }
            
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Resetting Password...';
        });
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    setTimeout(function() {
                        showToast('{{ message }}', '{{ category if category != "message" else "success" }}');
                    }, 100);
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
</body>
</html>
