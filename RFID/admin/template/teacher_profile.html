        <div class="toast-body">
            <div class="toast-title">${title || defaultTitle}</div>
            <div class="toast-msg">${message}</div>
        </div>
        <div class="toast-close" onclick="dismissToast(this.parentElement)">✕</div>
    `;
    document.body.appendChild(el);

function removeErrorStyles() {
    const fields = ['first_name', 'middle_name', 'last_name', 'extension', 'contact_number', 'email'];
    fields.forEach(id => {
        const input = document.getElementById(id);
        const errorDiv = document.getElementById(`${id}_error`);
        const validDiv = document.getElementById(`${id}_valid`);
        if (input) input.classList.remove('error');
        if (errorDiv) errorDiv.classList.remove('show');
        if (validDiv) validDiv.classList.remove('show');
    });
}

function showFieldStatus(fieldId, isValid, errorMessage = null) {
    const input = document.getElementById(fieldId);
    const errorDiv = document.getElementById(`${fieldId}_error`);
    const validDiv = document.getElementById(`${fieldId}_valid`);
    
    if (input && errorDiv && validDiv) {
        if (!input.value.trim()) {
            input.classList.remove('error');
            errorDiv.classList.remove('show');
            validDiv.classList.remove('show');
            return;
        }
        
        if (isValid) {
            input.classList.remove('error');
            errorDiv.classList.remove('show');
            validDiv.classList.add('show');
        } else {
            input.classList.add('error');
            errorDiv.classList.add('show');
            validDiv.classList.remove('show');
            if (errorMessage) {
                showToast(errorMessage, 'warning', 'Invalid Input');
            }
        }
    }
}

function validateName(value) {
    if (!value || value.trim() === '') return false;
    const trimmed = value.trim();
    if (trimmed.length < 2) return false;
    if (trimmed.length > 50) return false;
    return NAME_REGEX.test(trimmed);
}

function validateExtension(value) {
    if (!value || value.trim() === '') return true;
    const trimmed = value.trim();
    if (trimmed.length > 20) return false;
    return EXTENSION_REGEX.test(trimmed);
}

function validateContactNumber(value) {
    if (!value || value.trim() === '') return true;
    const cleaned = value.replace(/\s/g, '');
    if (cleaned.length !== 11) return false;
    if (!PHONE_REGEX.test(cleaned)) return false;
    return true;
}

function validateEmail(value) {
    if (!value || value.trim() === '') return false;
    return EMAIL_REGEX.test(value.trim());
}

function cleanNameInput(input) {
    let value = input.value;
    const original = value;
    value = value.replace(/[^A-Za-z\u00C0-\u00FF\u0100-\u017F\u0180-\u024F\u1E00-\u1EFF\s\-']/g, '');
    value = value.replace(/\s+/g, ' ').trim();
    if (value !== original) {
        input.value = value;
        if (original.match(/[0-9]/)) {
            showToast('Names cannot contain numbers', 'warning', 'Invalid Character');
        }
        if (original.match(/[!@#$%^&*()_+=[\]{};:"\\|,.<>/?]/)) {
            showToast('Names cannot contain special characters', 'warning', 'Invalid Character');
        }
    }
    return value;
}

function cleanContactInput(input) {
    let value = input.value;
    const original = value;
    value = value.replace(/[^\d]/g, '');
    if (value.length > 11) {
        value = value.slice(0, 11);
    }
    if (value !== original) {
        input.value = value;
        if (original.match(/[A-Za-z]/)) {
            showToast('Contact number can only contain digits', 'warning', 'Invalid Character');
        }
    }
    return value;
}

function updateAvatarDOM(src) {
    const ring = document.getElementById('avatarRing');
    // Replace whatever is inside the ring
    let img = document.getElementById('avatarImg');
    if (!img) {
        // Was showing initials — build an img element
        const init = document.getElementById('avatarInitials');
        if (init) init.remove();
        img = document.createElement('img');
        img.id = 'avatarImg';
        img.alt = 'Profile';
        img.className = 'avatar-img';
        ring.appendChild(img);
    }
    img.src = src;
}

function confirmRemovePhoto() {
    if (!confirm('Remove your profile picture?')) return;
    removePhoto();
}

async function removePhoto() {
    const btn = document.getElementById('removePhotoBtn');
    setBusy(btn, true);

    try {
        const res = await fetch("{{ url_for('admin_bp.remove_teacher_profile_pic') }}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();

        if (data.success) {
            // Revert to initials
            const ring = document.getElementById('avatarRing');
            const img = document.getElementById('avatarImg');
            if (img) img.remove();

            const initials = document.createElement('div');
            initials.id = 'avatarInitials';
            initials.className = 'avatar-initials';
            const fn = (document.getElementById('first_name').value || 'T')[0].toUpperCase();
            const ln = (document.getElementById('last_name').value  || 'E')[0].toUpperCase();
            initials.textContent = fn + ln;
            ring.appendChild(initials);

            btn.style.display = 'none';
            showToast('Profile picture removed.', 'info', 'Photo Removed');
        } else {
            showToast(data.message || 'Failed to remove picture.', 'error', 'Error');
        }
    } catch (err) {
        showToast('Network error. Please try again.', 'error', 'Connection Error');
    } finally {
        setBusy(btn, false, '<i class="fa-solid fa-trash-can"></i> Remove');
    }
}

function setupContactField() {
    const el = document.getElementById('contact_number');
    if (!el) return;

    el.addEventListener('input', () => {
        let v = el.value.replace(/\D/g, '');
        if (v.length > 11) {
            v = v.slice(0, 11);
            showToast('Contact number cannot exceed 11 digits', 'warning', 'Too Long');
        }
        el.value = v;
    });

    el.addEventListener('keypress', (e) => {
        if (!/\d/.test(e.key)) {
            e.preventDefault();
            showToast('Only numbers are allowed', 'warning', 'Invalid Input');
        }
    });
}
