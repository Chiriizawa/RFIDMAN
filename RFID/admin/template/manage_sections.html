{% extends "base.html" %}

{% block title %}My Sections - Teacher Dashboard{% endblock %}

{% block content %}
<style>
    .white-card {
        background: white;
        border-radius: 1.5rem;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    
    .header-gradient {
        background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%);
        padding: 1.5rem 2rem;
    }
    
    .text-accent {
        color: #f59e0b;
    }
    
    .btn-view {
        background: #3b82f6;
        color: white;
        font-weight: 600;
        padding: 0.35rem 0.9rem;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        transition: all 0.2s;
        cursor: pointer;
        border: none;
        text-decoration: none;
        display: inline-block;
    }
    
    .btn-view:hover {
        background: #2563eb;
        transform: translateY(-1px);
    }
    
    .data-table {
        width: 100%;
    }
    
    .data-table th {
        background: #f8fafc;
        padding: 1rem;
        text-align: left;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #64748b;
        border-bottom: 2px solid #e2e8f0;
    }
    
    .data-table td {
        padding: 1rem;
        font-size: 0.875rem;
        color: #1e293b;
        border-bottom: 1px solid #e2e8f0;
    }
    
    .data-table tr:hover {
        background: #f8fafc;
    }
    
    .badge {
        padding: 0.25rem 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.7rem;
        font-weight: 600;
        display: inline-block;
    }
    
    .badge-info {
        background: #dbeafe;
        color: #1e40af;
    }
    
    .empty-state {
        text-align: center;
        padding: 3rem;
        background: #f8fafc;
        border-radius: 1rem;
    }
    
    .empty-state i {
        font-size: 4rem;
        color: #cbd5e1;
        margin-bottom: 1rem;
    }
    
    .empty-state p {
        color: #64748b;
    }
    
    @media (max-width: 768px) {
        .header-gradient {
            padding: 1rem 1.25rem;
        }
        .data-table th, .data-table td {
            padding: 0.75rem;
        }
    }
</style>

<div class="max-w-7xl mx-auto px-4">
    <div class="white-card">
        <div class="header-gradient text-white">
            <div class="flex justify-between items-center flex-wrap gap-4">
                <div>
                    <h1 class="text-2xl font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-accent"></i>
                        My Assigned Sections
                    </h1>
                    <p class="text-white/80 text-sm mt-1">Sections assigned to you by the Super Admin</p>
                </div>
            </div>
        </div>
        
        <div class="p-6 overflow-x-auto">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Section Name</th>
                        <th>Year Level</th>
                        <th>No. of Students</th>
                        <th>Schedule</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="sectionsTableBody">
                    <tr><td colspan="6" class="text-center py-8"><div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading sections...</p></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let sections = [];
    
    async function fetchSections() {
        try {
            const response = await fetch('/admin/sections/api');
            const data = await response.json();
            if (data.success) {
                sections = data.sections;
                renderSectionsTable();
            } else {
                document.getElementById('sectionsTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-8"><div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>No sections assigned to you yet</p><p class="text-xs mt-2">Contact Super Admin to assign sections</p></div></td></tr>';
            }
        } catch (error) {
            console.error('Error fetching sections:', error);
            document.getElementById('sectionsTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-8"><div class="empty-state"><i class="fa-solid fa-exclamation-triangle"></i><p>Failed to load sections</p></div></td></tr>';
        }
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function renderSectionsTable() {
        const tbody = document.getElementById('sectionsTableBody');
        if (!sections || sections.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8"><div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>No sections assigned to you yet</p><p class="text-xs mt-2">Contact Super Admin to assign sections</p></div></td></tr>';
            return;
        }
        
        tbody.innerHTML = sections.map(section => `
            <tr>
                <td class="font-medium">${section.id}</td>
                <td><span class="badge badge-info">${escapeHtml(section.section_name)}</span></td>
                <td>${escapeHtml(section.year_level) || '—'}</td>
                <td>${section.student_count || 0}</td>
                <td class="text-xs text-gray-500 max-w-xs whitespace-pre-wrap">${escapeHtml(section.schedule) || '—'}</td>
                <td>
                    <a href="/admin/class_section/${section.id}" class="btn-view">
                        <i class="fa-solid fa-eye mr-1"></i> View Class
                    </a>
                </td>
            </tr>
        `).join('');
    }
    
    // Initialize
    fetchSections();
</script>
{% endblock %}
