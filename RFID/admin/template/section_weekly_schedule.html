{% extends "base.html" %}

{% block title %}{{ section_name }} - Weekly Schedule{% endblock %}

{% block content %}
<style>
    .white-card {
        background: white;
        border-radius: 1.5rem;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    
    .header-gradient {
        background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%);
        padding: 1.5rem 2rem;
    }
    
    .text-accent {
        color: #f59e0b;
    }
    
    .back-btn {
        background: rgba(255,255,255,0.2);
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        color: white;
        text-decoration: none;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
    }
    
    .back-btn:hover {
        background: rgba(255,255,255,0.3);
    }
    
    .schedule-table-container {
        overflow-x: auto;
        background: white;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
    }
    
    .weekly-schedule {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        min-width: 900px;
    }
    
    .weekly-schedule th {
        background: #1e293b;
        color: white;
        padding: 0.75rem 0.5rem;
        text-align: center;
        font-weight: 600;
        border: 1px solid #334155;
    }
    
    .weekly-schedule td {
        border: 1px solid #e2e8f0;
        padding: 0.5rem;
        vertical-align: top;
        background: white;
        min-width: 120px;
    }
    
    .weekly-schedule .time-cell {
        background: #f1f5f9;
        font-weight: 700;
        color: #1e293b;
        text-align: center;
        min-width: 80px;
        position: sticky;
        left: 0;
        font-size: 0.7rem;
    }
    
    .schedule-block {
        margin-bottom: 0.5rem;
        padding: 0.5rem;
        background: #fef3c7;
        border-radius: 0.5rem;
        border-left: 3px solid #f59e0b;
    }
    
    .schedule-block:last-child {
        margin-bottom: 0;
    }
    
    .subject-code {
        font-weight: 800;
        color: #d97706;
        font-size: 0.75rem;
        margin-bottom: 0.25rem;
    }
    
    .teacher-name {
        font-size: 0.65rem;
        color: #475569;
        margin-bottom: 0.15rem;
    }
    
    .room {
        font-size: 0.6rem;
        color: #6b7280;
        font-family: monospace;
        display: flex;
        align-items: center;
        gap: 0.25rem;
    }
    
    .time-badge {
        font-size: 0.6rem;
        color: #f59e0b;
        font-weight: 500;
        margin-top: 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.25rem;
    }
    
    .day-header {
        background: #1e293b;
        color: white;
        font-weight: 700;
        font-size: 0.9rem;
    }
    
    .student-list-card {
        background: #f8fafc;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-top: 1rem;
    }
    
    .student-item {
        padding: 0.5rem;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .student-item:last-child {
        border-bottom: none;
    }
    
    .export-btn {
        background: #f59e0b;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.8rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }
    
    .export-btn:hover {
        background: #d97706;
    }
    
    .loading-spinner {
        text-align: center;
        padding: 3rem;
    }
    
    .loading-spinner i {
        font-size: 3rem;
        color: #f59e0b;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    .empty-schedule {
        text-align: center;
        padding: 2rem;
        color: #64748b;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
        animation: fadeIn 0.3s ease;
    }
    
    @media (max-width: 768px) {
        .header-gradient {
            padding: 1rem;
        }
        .weekly-schedule {
            font-size: 0.6rem;
        }
        .weekly-schedule td, .weekly-schedule th {
            padding: 0.3rem;
        }
        .subject-code {
            font-size: 0.6rem;
        }
        .teacher-name, .room, .time-badge {
            font-size: 0.5rem;
        }
        .schedule-block {
            padding: 0.3rem;
        }
    }
</style>

<div class="max-w-7xl mx-auto px-4">
    <div class="white-card">
        <div class="header-gradient text-white">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div>
                    <a href="{{ url_for('admin_bp.teacher_schedules') }}" class="back-btn">
                        <i class="fa-solid fa-arrow-left"></i> Back to Sections
                    </a>
                    <h1 class="text-2xl font-semibold flex items-center gap-3 mt-3" id="sectionTitle">
                        <i class="fa-solid fa-calendar-week text-accent"></i>
                        Loading...
                    </h1>
                    <p class="text-white/80 mt-1" id="sectionInfo"></p>
                </div>
                <button onclick="exportToCSV()" class="export-btn">
                    <i class="fa-solid fa-download mr-2"></i> Export Schedule
                </button>
            </div>
        </div>

        <div class="p-6">
            <div id="scheduleContent">
                <div class="loading-spinner">
                    <i class="fa-solid fa-spinner"></i>
                    <p class="mt-2 text-gray-500">Loading schedule...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let scheduleData = null;
    const sectionId = {{ section_id }};
    
    // Days of the week (Monday to Friday only)
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    
    // Time slots (hourly from 7 AM to 5 PM)
    const TIME_SLOTS = [
        '07:00', '08:00', '09:00', '10:00', '11:00', 
        '12:00', '13:00', '14:00', '15:00', '16:00', '17:00'
    ];
    
    function formatTime(time) {
        if (!time) return '';
        // Convert "07:00" to "7:00 AM"
        let hour = parseInt(time.split(':')[0]);
        const minute = time.split(':')[1];
        const ampm = hour >= 12 ? 'PM' : 'AM';
        hour = hour % 12 || 12;
        return `${hour}:${minute} ${ampm}`;
    }
    
    function getTimeSlotLabel(startTime) {
        const hour = parseInt(startTime.split(':')[0]);
        const nextHour = hour + 1;
        const startFormatted = formatTime(startTime);
        const endFormatted = formatTime(`${String(nextHour).padStart(2, '0')}:00`);
        return `${startFormatted} - ${endFormatted}`;
    }
    
    async function loadSchedule() {
        try {
            const response = await fetch(`/admin/api/schedule_data/${sectionId}`);
            const data = await response.json();
            
            if (data.success) {
                scheduleData = data;
                
                // Update header
                document.getElementById('sectionTitle').innerHTML = `
                    <i class="fa-solid fa-calendar-week text-accent"></i>
                    ${escapeHtml(data.section.name)} - Weekly Schedule
                `;
                document.getElementById('sectionInfo').innerHTML = `
                    Year ${escapeHtml(data.section.year_level) || 'N/A'} | 
                    ${data.schedules.length} schedule(s) | 
                    ${data.students.length} student(s)
                `;
                
                renderScheduleTable();
                renderStudentList();
            } else {
                document.getElementById('scheduleContent').innerHTML = `
                    <div class="empty-schedule">
                        <i class="fa-regular fa-calendar-circle-exclamation text-4xl mb-3"></i>
                        <p>${data.error || 'Failed to load schedule'}</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error loading schedule:', error);
            document.getElementById('scheduleContent').innerHTML = `
                <div class="empty-schedule">
                    <i class="fa-solid fa-circle-exclamation text-4xl mb-3"></i>
                    <p>Network error. Please try again.</p>
                </div>
            `;
        }
    }
    
    function renderScheduleTable() {
        if (!scheduleData || !scheduleData.schedules) return;
        
        // Create a map for quick lookup: day + time_slot
        const scheduleMap = {};
        scheduleData.schedules.forEach(sch => {
            const hour = sch.time.split(':')[0];
            const key = `${sch.day}|${hour}`;
            if (!scheduleMap[key]) {
                scheduleMap[key] = [];
            }
            scheduleMap[key].push(sch);
        });
        
        // Build HTML
        let html = `
            <div class="schedule-table-container fade-in">
                <table class="weekly-schedule">
                    <thead>
                        <tr>
                            <th class="day-header">TIME</th>
                            <th class="day-header">MONDAY</th>
                            <th class="day-header">TUESDAY</th>
                            <th class="day-header">WEDNESDAY</th>
                            <th class="day-header">THURSDAY</th>
                            <th class="day-header">FRIDAY</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        for (const timeSlot of TIME_SLOTS) {
            const hour = timeSlot.split(':')[0];
            const timeLabel = getTimeSlotLabel(timeSlot);
            
            html += `<tr>`;
            html += `<td class="time-cell">${escapeHtml(timeLabel)}</td>`;
            
            for (const day of DAYS) {
                const key = `${day}|${hour}`;
                const schedules = scheduleMap[key] || [];
                
                html += `<td class="schedule-cell">`;
                
                if (schedules.length > 0) {
                    schedules.forEach(sch => {
                        html += `
                            <div class="schedule-block">
                                <div class="subject-code">
                                    <i class="fa-regular fa-bookmark mr-1"></i>
                                    ${escapeHtml(sch.subject)}
                                </div>
                                ${sch.teacher_name ? `
                                <div class="teacher-name">
                                    <i class="fa-solid fa-user-graduate mr-1"></i>
                                    ${escapeHtml(sch.teacher_name)}
                                </div>
                                ` : ''}
                                ${sch.room_name ? `
                                <div class="room">
                                    <i class="fa-solid fa-location-dot mr-1"></i>
                                    ${escapeHtml(sch.room_name)}
                                </div>
                                ` : ''}
                                <div class="time-badge">
                                    <i class="fa-regular fa-clock"></i>
                                    ${escapeHtml(sch.time)}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html += `<div style="height: 60px;"></div>`;
                }
                
                html += `</td>`;
            }
            
            html += `</tr>`;
        }
        
        html += `
                    </tbody>
                </table>
            </div>
        `;
        
        document.getElementById('scheduleContent').innerHTML = html;
    }
    
    function renderStudentList() {
        if (!scheduleData || !scheduleData.students || scheduleData.students.length === 0) return;
        
        const studentListHtml = `
            <div class="student-list-card fade-in mt-3">
                <h3 class="font-medium text-gray-800 mb-3">
                    <i class="fa-solid fa-users text-accent mr-2"></i>
                    Students in ${escapeHtml(scheduleData.section.name)} (${scheduleData.students.length})
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    ${scheduleData.students.map(student => `
                        <div class="student-item">
                            <div>
                                <span class="font-medium">${escapeHtml(student.name)}</span>
                                ${student.contact ? `
                                <span class="text-xs text-gray-500 ml-2">
                                    <i class="fa-solid fa-phone"></i> ${escapeHtml(student.contact)}
                                </span>
                                ` : ''}
                            </div>
                            ${student.email ? `
                            <a href="mailto:${escapeHtml(student.email)}" class="text-blue-500 text-xs hover:text-blue-700">
                                <i class="fa-regular fa-envelope"></i>
                            </a>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        
        document.getElementById('scheduleContent').innerHTML += studentListHtml;
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function exportToCSV() {
        if (!scheduleData || !scheduleData.schedules) {
            alert('No schedule data to export');
            return;
        }
        
        let csvContent = "TIME,MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY\n";
        
        for (const timeSlot of TIME_SLOTS) {
            const hour = timeSlot.split(':')[0];
            const timeLabel = getTimeSlotLabel(timeSlot);
            const row = [timeLabel];
            
            for (const day of DAYS) {
                const key = `${day}|${hour}`;
                const schedules = scheduleMapForExport[key] || [];
                
                if (schedules.length > 0) {
                    const scheduleText = schedules.map(sch => 
                        `${sch.subject} | ${sch.teacher_name || ''} | ${sch.room_name || ''}`
                    ).join('; ');
                    row.push(`"${scheduleText.replace(/"/g, '""')}"`);
                } else {
                    row.push('"---"');
                }
            }
            
            csvContent += row.join(',') + '\n';
        }
        
        // Create map for export
        const scheduleMapForExport = {};
        scheduleData.schedules.forEach(sch => {
            const hour = sch.time.split(':')[0];
            const key = `${sch.day}|${hour}`;
            if (!scheduleMapForExport[key]) {
                scheduleMapForExport[key] = [];
            }
            scheduleMapForExport[key].push(sch);
        });
        
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${scheduleData.section.name}_weekly_schedule.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        
        alert('Schedule exported successfully!');
    }
    
    // Load schedule on page load
    document.addEventListener('DOMContentLoaded', loadSchedule);
</script>
{% endblock %}
