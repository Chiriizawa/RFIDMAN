<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Social Blade{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            font-family: 'Inter', system-ui, sans-serif;
            scrollbar-width: none;
        }

        *::-webkit-scrollbar { display: none; }

        .sidebar {
            width: 78px;
            transition: width 0.3s ease;
            overflow: hidden;
        }

        .sidebar:hover { 
            width: 260px; 
        }

        .sidebar-text {
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.25s ease;
        }

        .sidebar:hover .sidebar-text { 
            opacity: 1; 
        }

        .nav-item {
            transition: all 0.2s ease;
        }

        .nav-item:hover { 
            background-color: #f8fafc; 
        }

        .active { 
            background-color: #dbeafe; 
            color: #1e40af; 
        }

        .logo-text {
            opacity: 0;
            transition: opacity 0.25s ease;
            white-space: nowrap;
        }

        .sidebar:hover .logo-text { 
            opacity: 1; 
        }
    </style>
</head>
<body class="bg-slate-50">
    <div class="flex h-screen overflow-hidden">

        <!-- SIDE NAVIGATION BAR -->
        <aside class="sidebar bg-white border-r border-slate-200 flex flex-col shadow-sm h-full">

            <!-- Logo -->
            <div class="px-4 pt-6 pb-4 flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center flex-shrink-0">
                    <span class="text-white text-2xl leading-none">▶</span>
                </div>
                <h1 class="logo-text text-2xl font-semibold tracking-tight text-slate-900">Tap & Know</h1>
            </div>

            <!-- Menu -->
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">

                <a href="{{ url_for('admin_bp.index') }}" 
                   class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <i class="fa-solid fa-house w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">Dashboard</span>
                </a>

                <a href="#" class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <i class="fa-solid fa-calendar w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">Schedules</span>
                </a>

                <a href="#" class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <i class="fa-solid fa-clock-rotate-left w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">History</span>
                </a>

                <!-- FIXED STUDENTS LINK -->
                <a href="{{ url_for('admin_bp.registered_students') }}" 
                   class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <i class="fa-solid fa-users w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">Students</span>
                </a>

                <div class="h-px bg-slate-200 mx-3 my-4"></div>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-slate-200 mt-auto">
                <div class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:text-slate-600 cursor-pointer rounded-2xl hover:bg-slate-50">
                    <div class="w-8 h-8 bg-slate-200 rounded-xl flex items-center justify-center text-slate-600">👨‍💼</div>
                    <div class="sidebar-text">
                        <div class="text-sm font-medium text-slate-700">Super Admin</div>
                        <div class="text-xs text-slate-500">admin@socialblade.com</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content flex-1 p-8 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
