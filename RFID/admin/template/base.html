<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tap & Know - Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            font-family: 'Inter', system-ui, sans-serif;
            scrollbar-width: none;
        }

        *::-webkit-scrollbar { 
            display: none; 
        }

        .sidebar {
            width: 78px;
            transition: width 0.3s ease;
            overflow: hidden;
            background: linear-gradient(to bottom, #1e40af, #1e3a8a);
        }

        .sidebar:hover { 
            width: 260px; 
        }

        .sidebar-text {
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.25s ease;
        }

        .sidebar:hover .sidebar-text { 
            opacity: 1; 
        }

        .nav-item {
            transition: all 0.3s ease;
            color: #e0f2fe;
        }

        .nav-item:hover { 
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Active State with Yellow Glow */
        .active { 
            background-color: #facc15 !important;
            color: #1e3a8a !important;
            font-weight: 700;
            box-shadow: 0 0 20px #facc15, 
                        0 0 35px rgba(250, 204, 21, 0.6);
            transform: translateX(6px);
        }

        .logo-text {
            opacity: 0;
            transition: opacity 0.25s ease;
            white-space: nowrap;
            color: #fefce8;
        }

        .sidebar:hover .logo-text { 
            opacity: 1; 
        }
    </style>
</head>
<body class="bg-slate-50">

    <div class="flex h-screen overflow-hidden">

        <!-- SIDE NAVIGATION BAR -->
        <aside class="sidebar bg-gradient-to-b from-blue-800 to-blue-900 border-r border-blue-700 flex flex-col shadow-xl h-full">

            <!-- Logo -->
            <div class="px-4 pt-6 pb-4 flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-400 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-md">
                    <span class="text-blue-900 text-2xl leading-none font-bold">▶</span>
                </div>
                <h1 class="logo-text text-2xl font-semibold tracking-tight">Tap & Know</h1>
            </div>

            <!-- Menu -->
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">

                <!-- Dashboard -->
                <a href="{{ url_for('admin_bp.index') }}" 
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                          {% if request.endpoint == 'admin_bp.index' %}active{% endif %}">
                    <i class="fa-solid fa-house w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">Dashboard</span>
                </a>

                <!-- Schedules -->
                <a href="{{ url_for('admin_bp.schedules') }}" 
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                          {% if request.endpoint == 'admin_bp.schedules' %}active{% endif %}">
                    <i class="fa-solid fa-calendar w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">Schedules</span>
                </a>

                <!-- History -->
                <a href="{{ url_for('admin_bp.history') }}" 
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                          {% if request.endpoint == 'admin_bp.history' %}active{% endif %}">
                    <i class="fa-solid fa-clock-rotate-left w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">History</span>
                </a>

                <!-- Students -->
                <a href="{{ url_for('admin_bp.registered_students') }}" 
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                          {% if request.endpoint == 'admin_bp.registered_students' %}active{% endif %}">
                    <i class="fa-solid fa-users w-6 h-6 min-w-[24px]"></i>
                    <span class="sidebar-text">Students</span>
                </a>

            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-blue-700 mt-auto">
                <div class="flex items-center gap-3 px-3 py-2 text-blue-200 hover:text-white cursor-pointer rounded-2xl hover:bg-white/10 transition">
                    <div class="w-8 h-8 bg-yellow-400 rounded-xl flex items-center justify-center text-blue-900 font-semibold">👨‍💼</div>
                    <div class="sidebar-text">
                        <div class="text-sm font-medium">Super Admin</div>
                        <div class="text-xs">admin@tapandknow.com</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-8 overflow-y-auto bg-slate-50">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
