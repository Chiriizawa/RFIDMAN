<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Social Blade{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            font-family: 'Inter', system-ui, sans-serif;
            scrollbar-width: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        .sidebar {
            width: 78px;
            transition: width 0.3s ease;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 260px;
        }

        .sidebar-text {
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-text {
            opacity: 1;
        }

        .nav-item {
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: #f8fafc;
        }

        .active {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .logo-text {
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        .sidebar:hover .logo-text {
            opacity: 1;
        }

        .notif-dot {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .notif-dot {
            opacity: 1;
        }

        .chevron {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .chevron {
            opacity: 1;
        }

        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 50;
            }

            .main-content {
                margin-left: 78px;
            }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div class="flex h-screen overflow-hidden">

        <!-- SIDE NAVIGATION BAR -->
        <aside class="sidebar bg-white border-r border-slate-200 flex flex-col shadow-sm h-full">

            <!-- Logo -->
            <div class="px-4 pt-6 pb-4 flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center flex-shrink-0">
                    <span class="text-white text-2xl leading-none">▶</span>
                </div>
                <h1 class="logo-text text-2xl font-semibold tracking-tight text-slate-900">
                    ADMIN
                </h1>
            </div>

            <!-- Menu -->
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">

                <a href="{{ url_for('admin_bp.index') }}" class="nav-item active flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 min-w-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                    </svg>
                    <span class="sidebar-text">Dashboard</span>
                </a>

                <a href="#" class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 min-w-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.5m-6.75-10.5L3 7.5m4.125 3.75L3 7.5m4.125 3.75L12 15m-3.375-3.75L12 7.5m-3.375 3.75l3.375-3.75" />
                    </svg>
                    <span class="sidebar-text">Products</span>
                </a>

                <a href="#" class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 min-w-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75c0 .621-.504 1.125-1.125 1.125h-2.25c-.621 0-1.125-.504-1.125-1.125v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25c-.621 0-1.125-.504-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25c-.621 0-1.125-.504-1.125-1.125V4.125z" />
                    </svg>
                    <span class="sidebar-text">Analytics</span>
                </a>

                <a href="#" class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 min-w-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V6.75a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 6.75v12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18.75zM3 12h18" />
                    </svg>
                    <span class="sidebar-text">Schedules</span>
                    <span class="notif-dot ml-auto bg-red-500 w-2 h-2 rounded-full ring-2 ring-white"></span>
                </a>

                <a href="#" class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 min-w-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="sidebar-text">History</span>
                </a>

                <a href="{{url_for('admin_bp.register')}}" class="nav-item flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-medium text-slate-700 hover:text-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 min-w-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <span class="sidebar-text">Register</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="chevron ml-auto w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>

                <div class="h-px bg-slate-200 mx-3 my-4"></div>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-slate-200 mt-auto">
                <div class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:text-slate-600 cursor-pointer rounded-2xl hover:bg-slate-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 min-w-[24px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93l.893.3c.533.18.89.66.89 1.213v.5c0 .553-.358 1.033-.89 1.213l-.893.3c-.396.166-.71.506-.78.93l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.02-.398-1.11-.94l-.149-.894c-.07-.424-.384-.764-.78-.93l-.893-.3c-.533-.18-.89-.66-.89-1.213v-.5c0-.553.358-1.033.89-1.213l.893-.3c.396-.166.71-.506.78-.93l.149-.894z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="sidebar-text text-sm font-medium">Logout</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content flex-1 p-8 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
