<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap & Know - Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { 
            font-family: 'Inter', system-ui, sans-serif; 
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(10,20,60,0.72) 0%, rgba(0,0,0,0.60) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .layout-wrapper {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            padding: 1rem;
            gap: 1rem;
        }

        /* SIDEBAR */
        .sidebar {
            width: 78px;
            transition: width 0.3s ease;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e1b4b 100%);
            box-shadow: 4px 0 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            border-radius: 1.5rem;
            height: 100%;
        }

        .sidebar:hover { 
            width: 260px; 
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #facc15 rgba(255,255,255,0.2);
            min-height: 0;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 5px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: #facc15;
            border-radius: 10px;
        }

        .sidebar:not(:hover) .sidebar-content::-webkit-scrollbar {
            width: 0px;
        }

        .sidebar:not(:hover) .sidebar-content {
            scrollbar-width: none;
        }

        .sidebar-text {
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.25s ease;
        }
        
        .sidebar:hover .sidebar-text { 
            opacity: 1; 
        }

        .logo-text {
            opacity: 0;
            white-space: nowrap;
            color: #fefce8;
            font-weight: 700;
            font-size: 1.25rem;
            transition: opacity 0.25s ease;
        }
        
        .sidebar:hover .logo-text { 
            opacity: 1; 
        }

        .sidebar-logo {
            flex-shrink: 0;
            padding: 1.5rem 1rem 1rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .sidebar-logo .flex {
            justify-content: center;
        }
        
        .logo-container {
            background-color: #facc15;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            width: 56px;
            height: 64px;
            flex-shrink: 0;
        }
        
        .sidebar:hover .logo-container {
            width: 70px;
            height: 80px;
        }
        
        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
            transition: all 0.3s ease;
        }

        /* Dropdown menu styles - Click to toggle */
        .dropdown-menu {
            display: none;
            margin-left: 2rem;
        }
        
        .dropdown-menu.show {
            display: block;
        }
        
        .dropdown-item {
            padding: 0.5rem 1rem;
            margin: 0.25rem 0;
            transition: all 0.25s ease;
            color: #bfdbfe;
            white-space: nowrap;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .dropdown-item:hover {
            background-color: rgba(255,255,255,0.12);
            color: #fff;
        }
        
        .dropdown-item.active {
            background-color: #facc15 !important;
            color: #1e3a8a !important;
            font-weight: 700;
        }
        
        .nav-item.has-dropdown {
            position: relative;
        }
        
        .nav-item.has-dropdown .dropdown-toggle {
            cursor: pointer;
        }
        
        .nav-item.has-dropdown .fa-chevron-down {
            transition: transform 0.3s ease;
        }
        
        .nav-item.has-dropdown.open .fa-chevron-down {
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .layout-wrapper {
                padding: 0.5rem;
                gap: 0.5rem;
            }
            
            .sidebar {
                width: 60px;
            }
            
            .sidebar:hover {
                width: 200px;
            }
            
            .logo-container {
                width: 44px;
                height: 52px;
            }
            
            .sidebar:hover .logo-container {
                width: 55px;
                height: 65px;
            }
            
            .logo-text {
                font-size: 1rem;
            }
            
            .glass-main {
                padding: 1rem;
            }
            
            .dropdown-menu {
                margin-left: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .sidebar {
                width: 50px;
            }
            
            .sidebar:hover {
                width: 180px;
            }
            
            .logo-container {
                width: 36px;
                height: 44px;
            }
            
            .sidebar:hover .logo-container {
                width: 45px;
                height: 55px;
            }
            
            .sidebar-logo {
                padding: 1rem 0.75rem 0.75rem 0.75rem;
            }
            
            .logo-text {
                font-size: 0.9rem;
            }
            
            .dropdown-menu {
                margin-left: 1rem;
            }
        }

        .sidebar-footer {
            flex-shrink: 0;
            padding: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
        }

        .nav-item {
            transition: all 0.25s ease;
            color: #bfdbfe;
            white-space: nowrap;
        }
        
        .nav-item:not(.has-dropdown):hover {
            background-color: rgba(255,255,255,0.12);
            color: #fff;
        }

        .active {
            background-color: #facc15 !important;
            color: #1e3a8a !important;
            font-weight: 700;
            box-shadow: 0 0 18px rgba(250,204,21,0.5);
            transform: translateX(4px);
        }

        .glass-main {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .glass-main::-webkit-scrollbar {
            width: 6px;
        }

        .glass-main::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .glass-main::-webkit-scrollbar-thumb {
            background: #facc15;
            border-radius: 10px;
        }
    </style>

    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/geminilogo.png') }}");
        }
    </style>
</head>

<body>

    <div class="layout-wrapper">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <div class="flex items-center gap-0 px-1">
                    <div class="logo-container">
                        <img src="{{ url_for('static', filename='images/cropted.png') }}" alt="Logo" class="logo-image">
                    </div>
                    <h1 class="logo-text tracking-tight"></h1>
                </div>
            </div>

            <!-- Scrollable Navigation Links -->
            <div class="sidebar-content px-3 py-4">
                <div class="space-y-1">
                    <a href="{{ url_for('admin_bp.index') }}"
                    class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                    {% if request.endpoint == 'admin_bp.index' %}active{% endif %}">
                        <i class="fa-solid fa-house w-5 text-center"></i>
                        <span class="sidebar-text">Dashboard</span>
                    </a>

                    <a href="{{ url_for('admin_bp.schedules') }}"
                    class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                    {% if request.endpoint == 'admin_bp.schedules' %}active{% endif %}">
                        <i class="fa-solid fa-calendar w-5 text-center"></i>
                        <span class="sidebar-text">Schedules</span>
                    </a>

                    <!-- My Classes with Dropdown - Click to toggle -->
                    <div class="nav-item has-dropdown" id="myClassesDropdown">
                        <div class="flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-medium dropdown-toggle">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-chalkboard-user w-5 text-center"></i>
                                <span class="sidebar-text">My Classes</span>
                            </div>
                            <i class="fa-solid fa-chevron-down text-xs sidebar-text"></i>
                        </div>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="{{ url_for('admin_bp.class_section', section_id='1-A') }}"
                            class="dropdown-item text-sm font-medium
                            {% if request.endpoint == 'admin_bp.class_section' and request.view_args.section_id == '1-A' %}active{% endif %}">
                                <i class="fa-solid fa-layer-group w-4 text-center"></i>
                                <span>Class 1-A</span>
                            </a>
                            <a href="{{ url_for('admin_bp.class_section', section_id='1-B') }}"
                            class="dropdown-item text-sm font-medium
                            {% if request.endpoint == 'admin_bp.class_section' and request.view_args.section_id == '1-B' %}active{% endif %}">
                                <i class="fa-solid fa-layer-group w-4 text-center"></i>
                                <span>Class 1-B</span>
                            </a>
                            <a href="{{ url_for('admin_bp.class_section', section_id='2-A') }}"
                            class="dropdown-item text-sm font-medium
                            {% if request.endpoint == 'admin_bp.class_section' and request.view_args.section_id == '2-A' %}active{% endif %}">
                                <i class="fa-solid fa-layer-group w-4 text-center"></i>
                                <span>Class 2-A</span>
                            </a>
                            <a href="{{ url_for('admin_bp.class_section', section_id='2-B') }}"
                            class="dropdown-item text-sm font-medium
                            {% if request.endpoint == 'admin_bp.class_section' and request.view_args.section_id == '2-B' %}active{% endif %}">
                                <i class="fa-solid fa-layer-group w-4 text-center"></i>
                                <span>Class 2-B</span>
                            </a>
                            <a href="{{ url_for('admin_bp.class_section', section_id='3-A') }}"
                            class="dropdown-item text-sm font-medium
                            {% if request.endpoint == 'admin_bp.class_section' and request.view_args.section_id == '3-A' %}active{% endif %}">
                                <i class="fa-solid fa-layer-group w-4 text-center"></i>
                                <span>Class 3-A</span>
                            </a>
                        </div>
                    </div>

                    <a href="{{ url_for('admin_bp.registered_students') }}"
                    class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                    {% if request.endpoint == 'admin_bp.registered_students' %}active{% endif %}">
                        <i class="fa-solid fa-users w-5 text-center"></i>
                        <span class="sidebar-text">Students</span>
                    </a>

                    <a href="{{ url_for('admin_bp.teacher_profile') }}"
                    class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium
                    {% if request.endpoint == 'admin_bp.teacher_profile' %}active{% endif %}">
                        <i class="fa-solid fa-user-tie w-5 text-center"></i>
                        <span class="sidebar-text">My Profile</span>
                    </a>
                </div>
            </div>

            <!-- Logout Section -->
            <div class="sidebar-footer">
                <a href="{{ url_for('admin_bp.teacher_logout') }}"
                class="flex items-center gap-3 px-3 py-3 text-blue-300 hover:text-red-300
                hover:bg-white/10 rounded-2xl transition-all font-medium">
                    <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                    <span class="sidebar-text">Logout</span>
                </a>
            </div>
        </aside>

        <main class="glass-main p-8 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script>
        // Dropdown toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const dropdownToggle = document.querySelector('.dropdown-toggle');
            const dropdownMenu = document.getElementById('dropdownMenu');
            const dropdownContainer = document.getElementById('myClassesDropdown');
            
            // Check if we're on a class section page
            const isOnClassPage = window.location.href.includes('/class_section/');
            
            // If on a class page, keep dropdown open
            if (isOnClassPage) {
                dropdownMenu.classList.add('show');
                dropdownContainer.classList.add('open');
            }
            
            // Dropdown click handler
            if (dropdownToggle && dropdownMenu) {
                dropdownToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('show');
                    dropdownContainer.classList.toggle('open');
                });
            }
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(event) {
                if (dropdownContainer && !dropdownContainer.contains(event.target)) {
                    dropdownMenu.classList.remove('show');
                    dropdownContainer.classList.remove('open');
                }
            });
        });
    </script>

</body>
</html>
