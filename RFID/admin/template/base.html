    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tap & Know - Admin</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <style>
            * { 
                font-family: 'Inter', system-ui, sans-serif; 
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                position: relative;
            }

            /* ✅ FIX: Overlay is a SEPARATE layer, not competing with background */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background: linear-gradient(135deg, rgba(10,20,60,0.72) 0%, rgba(0,0,0,0.60) 100%);
                z-index: 0;
                pointer-events: none;
            }

            /* Everything above the overlay */
            .layout-wrapper {
                position: relative;
                z-index: 1;
                height: 100vh;
                display: flex;
                padding: 1rem;
                gap: 1rem;
            }

            /* SIDEBAR - Perfect height from the start */
            .sidebar {
                width: 78px;
                transition: width 0.3s ease;
                overflow: hidden;
                background: linear-gradient(180deg, #1e3a8a 0%, #1e1b4b 100%);
                box-shadow: 4px 0 24px rgba(0,0,0,0.5);
                border: 1px solid rgba(255,255,255,0.08);
                display: flex;
                flex-direction: column;
                border-radius: 1.5rem;
                height: 100%;
            }

            .sidebar:hover { 
                width: 260px; 
            }

            /* Sidebar content container - handles scrolling */
            .sidebar-content {
                flex: 1;
                overflow-y: auto;
                overflow-x: hidden;
                scrollbar-width: thin;
                scrollbar-color: #facc15 rgba(255,255,255,0.2);
                min-height: 0; /* Critical for flex scrolling */
            }

            /* Custom scrollbar styling for Webkit browsers */
            .sidebar-content::-webkit-scrollbar {
                width: 5px;
            }

            .sidebar-content::-webkit-scrollbar-track {
                background: rgba(255,255,255,0.1);
                border-radius: 10px;
            }

            .sidebar-content::-webkit-scrollbar-thumb {
                background: #facc15;
                border-radius: 10px;
                transition: background 0.2s ease;
            }

            .sidebar-content::-webkit-scrollbar-thumb:hover {
                background: #eab308;
            }

            /* When sidebar is collapsed, hide scrollbar but keep functionality */
            .sidebar:not(:hover) .sidebar-content::-webkit-scrollbar {
                width: 0px;
            }

            .sidebar:not(:hover) .sidebar-content {
                scrollbar-width: none;
            }

            .sidebar-text {
                opacity: 0;
                white-space: nowrap;
                transition: opacity 0.25s ease;
            }
            
            .sidebar:hover .sidebar-text { 
                opacity: 1; 
            }

            .logo-text {
                opacity: 0;
                transition: opacity 0.25s ease;
                white-space: nowrap;
                color: #fefce8;
                font-weight: 700;
            }
            
            .sidebar:hover .logo-text { 
                opacity: 1; 
            }

            /* Logo section - fixed at top */
            .sidebar-logo {
                flex-shrink: 0;
                padding: 1.5rem 1rem 1rem 1rem;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }

            /* Logout section - fixed at bottom */
            .sidebar-footer {
                flex-shrink: 0;
                padding: 1rem;
                border-top: 1px solid rgba(255,255,255,0.1);
                background: rgba(0,0,0,0.2);
            }

            .nav-item {
                transition: all 0.25s ease;
                color: #bfdbfe;
                white-space: nowrap;
            }
            
            .nav-item:hover {
                background-color: rgba(255,255,255,0.12);
                color: #fff;
            }

            .active {
                background-color: #facc15 !important;
                color: #1e3a8a !important;
                font-weight: 700;
                box-shadow: 0 0 18px rgba(250,204,21,0.5);
                transform: translateX(4px);
            }

            /* MAIN GLASS PANEL */
            .glass-main {
                background: rgba(255,255,255,0.08);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                border: 1px solid rgba(255,255,255,0.15);
                border-radius: 1.5rem;
                overflow-y: auto;
                flex: 1;
            }

            /* Custom scrollbar for main content */
            .glass-main::-webkit-scrollbar {
                width: 6px;
            }

            .glass-main::-webkit-scrollbar-track {
                background: rgba(255,255,255,0.1);
                border-radius: 10px;
            }

            .glass-main::-webkit-scrollbar-thumb {
                background: #facc15;
                border-radius: 10px;
            }

            .glass-main::-webkit-scrollbar-thumb:hover {
                background: #eab308;
            }

            /* Smooth transitions */
            .sidebar, .sidebar-content {
                transition: all 0.3s ease;
            }
        </style>
